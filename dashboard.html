<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>

  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#0f172a;
      color:#fff;
      text-align:center;
    }

    .box{
      width:90%;
      max-width:400px;
      margin:80px auto;
      background:#fff;
      color:#000;
      padding:20px;
      border-radius:10px;
    }

    .top-header{
  background:#f5b800;
  color:#fff;
  padding:20px;
  text-align:left;
  font-size:20px;
  font-weight:bold;
}

.top-header h2{
  margin:0;
}
    button{
      width:100%;
      padding:12px;
      background:#2563eb;
      color:#fff;
      border:none;
      border-radius:8px;
      font-size:18px;
      cursor:pointer;
    }
  </style>
</head>
<body>

  <header class="top-header">
  <h2>My Freelancer</h2>
  </header>
  
<div class="box">
    <h1>My Freelancer</h1>

    <h3 id="userEmail">Loading...</h3>
<h3 id="referralCode">Referral Code: Loading...</h3>
  <h3 id="referralCount">Referral Count: 0</h3>
    <br>

    <button id="logoutBtn">Logout</button>
</div>

<script type="module" src="dashboard.js"></script>

</body>
</html>
