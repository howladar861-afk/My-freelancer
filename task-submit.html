<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Task Submit</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #222;
    }

    .header {
      background: #f5b800;
      color: white;
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
    }

    .box {
      width: 90%;
      max-width: 450px;
      margin: 30px auto;
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-sizing: border-box;
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    .info {
      background: #f1f5f9;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .info p {
      margin: 8px 0;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    input[type="file"] {
      background: #f8fafc;
    }

    .preview {
      width: 100%;
      margin-top: 15px;
      border-radius: 12px;
      display: none;
    }

    .submit-btn {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .back-btn {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #ddd;
      color: #222;
      font-size: 16px;
      cursor: pointer;
    }

    .status {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="header">
    My Freelancer
  </div>

  <div class="box">

    <h2>📸 কাজের Screenshot Submit</h2>

    <div class="info">
      <p><b>Task:</b> <span id="taskName">Loading...</span></p>
      <p><b>Reward:</b> ৳<span id="taskReward">0</span></p>
    </div>

    <label>Task Name</label>

    <input
      type="text"
      id="taskInput"
      placeholder="কাজের নাম লিখুন"
    >

    <label>কাজের Screenshot</label>

    <input
      type="file"
      id="screenshot"
      accept="image/*"
    >

    <img
      id="preview"
      class="preview"
      alt="Screenshot Preview"
    >

    <button
      class="submit-btn"
      id="submitBtn"
      onclick="submitTask()">
      📤 Screenshot Submit
    </button>

    <button
      class="back-btn"
      onclick="history.back()">
      Back
    </button>

    <div
      id="status"
      class="status">
    </div>

  </div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


// =====================================
// FIREBASE CONFIG
// =====================================

const firebaseConfig = {

  apiKey:
    "AIzaSyBFUKPT7fo6sUofdO09ffiZgjdlaR5evm8",

  authDomain:
    "rakib-freelancer-9c66b.firebaseapp.com",

  projectId:
    "rakib-freelancer-9c66b",

  storageBucket:
    "rakib-freelancer-9c66b.firebasestorage.app",

  messagingSenderId:
    "541209844482",

  appId:
    "1:541209844482:web:510568d5226c9bf47ac01b"
};


// =====================================
// FIREBASE INIT
// =====================================

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


// =====================================
// CLOUDINARY
// =====================================

const CLOUD_NAME = "kjkqazv1";

const UPLOAD_PRESET = "screenshot_upload";


// =====================================
// USER
// =====================================

let currentUser = null;


onAuthStateChanged(auth, (user) => {

  if (!user) {

    alert("⚠️ আগে Login করুন");

    window.location.href = "index.html";

    return;
  }

  currentUser = user;

});


// =====================================
// TASK INFO
// =====================================

const urlParams =
  new URLSearchParams(window.location.search);

const taskIdFromUrl =
  urlParams.get("taskId");
let realTaskName = "";
let realReward = 0;

async function loadTask() {

  if (!taskIdFromUrl) {
    alert("❌ Task ID পাওয়া যায়নি");
    return;
  }

  try {

    const taskRef = doc(
      db,
      "tasks",
      taskIdFromUrl
    );

    const taskSnap = await getDoc(taskRef);

    if (!taskSnap.exists()) {
      alert("❌ Task পাওয়া যায়নি");
      return;
    }

    const taskData = taskSnap.data();

    realTaskName = taskData.taskName || "";
    realReward = Number(taskData.reward || 0);

    document.getElementById("taskName").textContent =
      realTaskName;

    document.getElementById("taskReward").textContent =
      realReward;

    document.getElementById("taskInput").value =
      realTaskName;

  } catch (error) {

    console.error("Task Load Error:", error);

    alert("❌ Task Load করা যায়নি");

  }

}

loadTask();

const taskNameElement =
  document.getElementById("taskName");

const taskRewardElement =
  document.getElementById("taskReward");

const taskInput =
  document.getElementById("taskInput");




// =====================================
// SCREENSHOT PREVIEW
// =====================================

const screenshotInput =
  document.getElementById("screenshot");

const preview =
  document.getElementById("preview");


screenshotInput.addEventListener(
  "change",
  function () {

    const file = this.files[0];

    if (!file) {

      preview.style.display =
        "none";

      return;
    }


    const imageUrl =
      URL.createObjectURL(file);

    preview.src =
      imageUrl;

    preview.style.display =
      "block";

  }
);


// =====================================
// CLOUDINARY UPLOAD
// =====================================

async function uploadScreenshot(file) {

  if (!file) {

    throw new Error(
      "Screenshot নির্বাচন করুন"
    );

  }


  const formData =
    new FormData();


  formData.append(
    "file",
    file
  );


  formData.append(
    "upload_preset",
    UPLOAD_PRESET
  );


  const response =
    await fetch(
      `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
      {
        method: "POST",
        body: formData
      }
    );


  const data =
    await response.json();


  if (!response.ok) {

    console.error(
      "Cloudinary Error:",
      data
    );

    throw new Error(
      data.error?.message ||
      "Screenshot upload failed"
    );

  }


  return data.secure_url;

}


// =====================================
// SUBMIT TASK
// =====================================

window.submitTask =
  async function () {

    const taskName =
      document
        .getElementById("taskInput")
        .value
        .trim();


    const screenshotFile =
      document
        .getElementById("screenshot")
        .files[0];


    if (!taskName) {

      alert(
        "⚠️ Task Name লিখুন"
      );

      return;
    }


    if (!screenshotFile) {

      alert(
        "⚠️ কাজের Screenshot নির্বাচন করুন"
      );

      return;
    }


    if (!currentUser) {

      alert(
        "⚠️ আগে Login করুন"
      );

      window.location.href =
        "index.html";

      return;
    }


    const submitBtn =
      document.getElementById(
        "submitBtn"
      );


    const status =
      document.getElementById(
        "status"
      );


    try {

      submitBtn.disabled =
        true;

      submitBtn.textContent =
        "⏳ Screenshot Upload হচ্ছে...";


      // ==============================
      // UPLOAD SCREENSHOT
      // ==============================

      const screenshotUrl =
        await uploadScreenshot(
          screenshotFile
        );


      submitBtn.textContent =
        "⏳ Submission Save হচ্ছে...";


      // ==============================
      // SAVE FIRESTORE
      // ==============================

      const reward = realReward;


      await addDoc(
        collection(
          db,
          "taskSubmissions"
        ),
        {

          userId:
            currentUser.uid,

          email:
            currentUser.email || "",

          taskId:
  taskIdFromUrl,
          
          taskName:
            taskName,

          reward:
            reward,

          screenshotUrl:
            screenshotUrl,

          status:
            "pending",

          submittedAt:
            serverTimestamp()

        }
      );


      // ==============================
      // SUCCESS
      // ==============================

      status.style.display =
        "block";

      status.style.background =
        "#dcfce7";

      status.style.color =
        "#166534";

      status.textContent =
        "✅ Screenshot সফলভাবে জমা হয়েছে। Admin Review করবে।";


      submitBtn.textContent =
        "✅ Submitted";


      setTimeout(() => {

        window.location.href =
          "dashboard.html";

      }, 2000);


    } catch (error) {

      console.error(
        "Task Submit Error:",
        error
      );


      status.style.display =
        "block";

      status.style.background =
        "#fee2e2";

      status.style.color =
        "#991b1b";

      status.textContent =
        "❌ Submit করা যায়নি: " +
        error.message;


      submitBtn.disabled =
        false;

      submitBtn.textContent =
        "📤 Screenshot Submit";

    }

  };

</script>

</body>
  </html>
