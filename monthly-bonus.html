<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


// =====================================
// FIREBASE CONFIG
// LOGIN FILE-এর সাথে একই
// =====================================

const firebaseConfig = {

  apiKey:
    "AIzaSyBFUKPT7fo6sUofdO09ffiZgjdlaR5evm8",

  authDomain:
    "rakib-freelancer-9c66b.firebaseapp.com",

  projectId:
    "rakib-freelancer-9c66b",

  storageBucket:
    "rakib-freelancer-9c66b.firebasestorage.app",

  messagingSenderId:
    "541209844482",

  appId:
    "1:541209844482:web:510568d5226c9bf47ac01b",

  measurementId:
    "G-F6QNE0QN5K"
};


// =====================================
// FIREBASE START
// =====================================

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


// =====================================
// LOGIN SESSION LOCAL রাখবে
// =====================================

await setPersistence(
  auth,
  browserLocalPersistence
);


// =====================================
// SETTINGS
// =====================================

const TARGET = 120;
const BONUS = 1000;
const TOTAL_DAYS = 30;


// =====================================
// ELEMENTS
// =====================================

const loading =
  document.getElementById("loading");

const errorBox =
  document.getElementById("error");

const bonusPage =
  document.getElementById("bonusPage");

const verifyCount =
  document.getElementById("verifyCount");

const progressBar =
  document.getElementById("progressBar");

const progressText =
  document.getElementById("progressText");

const daysPassed =
  document.getElementById("daysPassed");

const daysLeft =
  document.getElementById("daysLeft");

const status =
  document.getElementById("status");


// =====================================
// AUTH CHECK
// =====================================

onAuthStateChanged(auth, async (user) => {

  console.log("Monthly Bonus User:", user);

  // Login করা নেই
  if (!user) {

    loading.style.display = "none";

    bonusPage.style.display = "block";

    bonusPage.innerHTML = `
      <div class="card">

        <div class="icon">
          🔐
        </div>

        <h1>
          আগে Login করুন
        </h1>

        <div class="subtitle">
          Monthly Bonus দেখতে আপনার
          Account-এ Login থাকতে হবে।
        </div>

        <button
          onclick="window.location.href='index.html'"
          style="
            border:none;
            background:#2563eb;
            color:white;
            padding:15px 35px;
            border-radius:15px;
            font-size:18px;
            cursor:pointer;
          ">
          Login করুন
        </button>

      </div>
    `;

    return;
  }


  // ===================================
  // USER LOGIN করা আছে
  // ===================================

  try {

    await loadMonthlyBonus(user);

    loading.style.display = "none";

    bonusPage.style.display = "block";

  }

  catch (error) {

    console.error(
      "Monthly Bonus Error:",
      error
    );

    loading.style.display = "none";

    errorBox.style.display = "block";

    errorBox.innerHTML =
      "❌ Bonus তথ্য লোড করা যায়নি<br><br>" +
      "<b>Error:</b> " +
      error.code +
      "<br>" +
      error.message;

  }

});


// =====================================
// LOAD MONTHLY BONUS
// =====================================

async function loadMonthlyBonus(user) {

  const bonusRef =
    doc(
      db,
      "monthlyBonus",
      user.uid
    );


  const bonusSnap =
    await getDoc(bonusRef);


  let data;


  // ===================================
  // প্রথমবার Monthly Bonus
  // ===================================

  if (!bonusSnap.exists()) {

    data = {

      verifyCount: 0,

      periodStart:
        new Date().toISOString(),

      target:
        TARGET,

      bonusAmount:
        BONUS,

      createdAt:
        serverTimestamp()

    };


    await setDoc(
      bonusRef,
      data
    );

  }

  else {

    data =
      bonusSnap.data();

  }


  // ===================================
  // START DATE
  // ===================================

  let startDate =
    new Date(
      data.periodStart
    );


  if (
    isNaN(
      startDate.getTime()
    )
  ) {

    startDate =
      new Date();


    await setDoc(
      bonusRef,
      {
        periodStart:
          startDate.toISOString()
      },
      {
        merge: true
      }
    );

  }


  // ===================================
  // 30 DAYS CHECK
  // ===================================

  const now =
    new Date();


  const diff =
    now.getTime() -
    startDate.getTime();


  const passedDays =
    Math.floor(
      diff /
      (1000 * 60 * 60 * 24)
    );


  // ===================================
  // 30 DAYS শেষ
  // নতুন মাস শুরু
  // ===================================

  if (
    passedDays >= TOTAL_DAYS
  ) {

    data.verifyCount = 0;

    data.periodStart =
      now.toISOString();


    await setDoc(
      bonusRef,
      {

        verifyCount: 0,

        periodStart:
          now.toISOString(),

        target:
          TARGET,

        bonusAmount:
          BONUS,

        updatedAt:
          serverTimestamp()

      },
      {
        merge: true
      }
    );


    startDate =
      now;

  }


  // ===================================
  // UPDATE SCREEN
  // ===================================

  updateUI(
    Number(
      data.verifyCount || 0
    ),
    startDate
  );

}


// =====================================
// UPDATE UI
// =====================================

function updateUI(
  count,
  startDate
) {

  const safeCount =
    Math.max(
      0,
      Math.min(
        count,
        TARGET
      )
    );


  // VERIFY COUNT

  verifyCount.textContent =
    safeCount +
    " / " +
    TARGET;


  // ===================================
  // PROGRESS
  // ===================================

  const percent =
    Math.round(
      (
        safeCount /
        TARGET
      ) * 100
    );


  progressBar.style.width =
    percent + "%";


  progressText.textContent =
    percent +
    "% সম্পন্ন";


  // ===================================
  // DAYS
  // ===================================

  const now =
    new Date();


  const diff =
    now.getTime() -
    startDate.getTime();


  let passed =
    Math.floor(
      diff /
      (1000 * 60 * 60 * 24)
    );


  passed =
    Math.max(
      0,
      Math.min(
        passed,
        TOTAL_DAYS
      )
    );


  const left =
    TOTAL_DAYS -
    passed;


  daysPassed.textContent =
    passed;


  daysLeft.textContent =
    left;


  // ===================================
  // STATUS
  // ===================================

  if (
    safeCount >= TARGET
  ) {

    status.innerHTML =
      "🎉 অভিনন্দন! ১২০টি Verify সম্পন্ন হয়েছে।<br>" +
      "৳১,০০০ Bonus-এর জন্য যোগ্য!";

  }

  else {

    status.innerHTML =
      "🚀 Monthly Challenge চলছে — লক্ষ্য ১২০ Verify";

  }

}

      </script>
