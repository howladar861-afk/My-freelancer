<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Monthly Bonus - Rakib Freelancer</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #eef4ff, #ffffff);
      min-height: 100vh;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    .top {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .back-btn {
      border: none;
      background: #2563eb;
      color: white;
      padding: 11px 18px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    .title {
      flex: 1;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .card {
      background: white;
      border-radius: 25px;
      padding: 25px 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.10);
      text-align: center;
    }

    .icon {
      font-size: 60px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 22px;
    }

    .reward {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .reward-title {
      font-size: 17px;
    }

    .amount {
      font-size: 36px;
      font-weight: bold;
      margin: 8px 0;
    }

    .verify {
      background: #f7f9ff;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .verify-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .count {
      color: #2563eb;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .progress-bg {
      width: 100%;
      height: 18px;
      background: #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #06b6d4);
      border-radius: 20px;
      transition: 0.5s;
    }

    .percent {
      color: #666;
      margin-top: 9px;
      font-size: 14px;
    }

    .days {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .day-box {
      flex: 1;
      background: #f8fafc;
      padding: 18px 10px;
      border-radius: 18px;
    }

    .day-icon {
      font-size: 28px;
    }

    .day-number {
      font-size: 25px;
      font-weight: bold;
      color: #2563eb;
      margin: 5px 0;
    }

    .day-label {
      font-size: 13px;
      color: #666;
    }

    .status {
      background: #ecfdf5;
      color: #047857;
      padding: 15px;
      border-radius: 15px;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .message {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .message h3 {
      margin-bottom: 8px;
    }

    .message p {
      color: #555;
      line-height: 1.6;
      font-size: 14px;
    }

    .rules {
      text-align: left;
      background: #f8fafc;
      padding: 18px;
      border-radius: 18px;
    }

    .rules h3 {
      text-align: center;
      margin-bottom: 12px;
    }

    .rules p {
      font-size: 14px;
      padding: 6px 0;
      line-height: 1.5;
    }

    #loading {
      text-align: center;
      padding: 80px 10px;
      color: #666;
      font-size: 18px;
    }

    #error {
      display: none;
      background: #fef2f2;
      color: #b91c1c;
      padding: 18px;
      border-radius: 15px;
      text-align: center;
      line-height: 1.6;
    }

    #bonusPage {
      display: none;
    }

    .footer {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="top">

    <button
      class="back-btn"
      onclick="history.back()">
      ← Back
    </button>

    <div class="title">
      Monthly Bonus
    </div>

  </div>


  <!-- LOADING -->

  <div id="loading">
    ⏳ Bonus তথ্য লোড হচ্ছে...
  </div>


  <!-- ERROR -->

  <div id="error"></div>


  <!-- MAIN PAGE -->

  <div id="bonusPage">

    <div class="card">

      <div class="icon">
        💎
      </div>

      <h1>
        Monthly Bonus
      </h1>

      <div class="subtitle">
        ৩০ দিনের Verification Challenge
      </div>


      <!-- BONUS -->

      <div class="reward">

        <div class="reward-title">
          🏆 ৩০ দিনে লক্ষ্য পূ
