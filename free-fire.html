<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FF TOPUP</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7ff;
    color: #111;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 25px 15px 50px;
}

.title {
    text-align: center;
    font-size: 42px;
    font-weight: 900;
    color: #173b68;
    margin: 10px 0 30px;
}

.products {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
}

.card {
    background: #fff;
    border-radius: 22px;
    overflow: hidden;
    border: 1px solid #ddd;
    box-shadow: 0 5px 15px rgba(0,0,0,0.12);
    cursor: pointer;
    transition: 0.2s;
}

.card:active {
    transform: scale(0.97);
}

.card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
}

.card-name {
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 15px;
    font-size: 25px;
    font-weight: 700;
    line-height: 1.35;
}

/* মোবাইল */
@media (max-width: 700px) {
    .container {
        padding: 18px 12px 40px;
    }

    .title {
        font-size: 32px;
        margin-bottom: 22px;
    }

    .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
    }

    .card {
        border-radius: 16px;
    }

    .card-name {
        min-height: 85px;
        font-size: 17px;
        padding: 10px;
    }
}

/* খুব ছোট ফোন */
@media (max-width: 380px) {
    .products {
        gap: 10px;
    }

    .card-name {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="title">FF TOPUP</div>

    <div class="products">

        <!-- 1 -->
        <div class="card" onclick="openProduct('UID TopUp (BD)')">
            <img src="uid-topup.jpg" alt="UID TopUp">
            <div class="card-name">
                UID TopUp<br>(BD)
            </div>
        </div>

        <!-- 2 -->
        <div class="card" onclick="openProduct('Weekly/Monthly Offer')">
            <img src="weekly-monthly.jpg" alt="Weekly Monthly">
            <div class="card-name">
                Weekly/Monthly<br>Offer
            </div>
        </div>

        <!-- 3 -->
        <div class="card" onclick="openProduct('Weekly Lite (BD Server)')">
            <img src="weekly-lite.jpg" alt="Weekly Lite">
            <div class="card-name">
                Weekly Lite<br>(BD Server)
            </div>
        </div>

        <!-- 4 -->
        <div class="card" onclick="openProduct('Level Up Pass')">
            <img src="level-up-pass.jpg" alt="Level Up Pass">
            <div class="card-name">
                Level Up Pass
            </div>
        </div>

        <!-- 5 -->
        <div class="card" onclick="openProduct('FF Likes')">
            <img src="ff-likes.jpg" alt="FF Likes">
            <div class="card-name">
                FF Likes
            </div>
        </div>

        <!-- 6 -->
        <div class="card" onclick="openProduct('Indonesia Server')">
            <img src="indonesia.jpg" alt="Indonesia Server">
            <div class="card-name">
                Indonesia<br>Server
            </div>
        </div>

    </div>
</div>

<script>
function openProduct(productName) {
    alert(productName + " নির্বাচন করা হয়েছে");

    // পরে এখানে তোমার পরের পেজ দিতে পারবে।
    // উদাহরণ:
    // window.location.href = "uid-topup.html";
}
</script>

</body>
</html>
