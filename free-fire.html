<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FF TOPUP</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f4f7ff;
    font-family:Arial, sans-serif;
    padding:20px 12px 40px;
}

.title{
    text-align:center;
    color:#173f70;
    font-size:44px;
    font-weight:800;
    margin:10px 0 35px;
}

.cards{
    width:100%;
    max-width:720px;
    margin:auto;

    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:16px;
}

.card{
    background:#fff;
    border:2px solid #e3e3e3;
    border-radius:24px;
    overflow:hidden;
    text-align:center;

    box-shadow:0 5px 18px rgba(0,0,0,.12);

    transition:transform .2s;
}

.card:active{
    transform:scale(.97);
}

/* শুধু ছবির জন্য */
.card img{
    width:100%;
    height:190px;
    display:block;
    object-fit:cover;
}

/* নিচের নাম */
.card-name{
    min-height:85px;
    display:flex;
    align-items:center;
    justify-content:center;

    padding:10px;

    font-size:21px;
    font-weight:700;
    line-height:1.3;
    color:#111;
}


/* মোবাইল */
@media(max-width:500px){

    body{
        padding:15px 10px 35px;
    }

    .title{
        font-size:40px;
        margin-bottom:30px;
    }

    .cards{
        gap:12px;
    }

    .card{
        border-radius:22px;
    }

    .card img{
        width:100%;
        height:160px;
        object-fit:cover;
    }

    .card-name{
        min-height:78px;
        font-size:18px;
    }
}
</style>
</head>

<body>

<h1 class="title">FF TOPUP</h1>

<div class="cards">

    <!-- 1 UID TopUp -->
    <div class="card" onclick="openPage('uid-topup.html')">

        <img src="uid-topup.jpg" alt="UID TopUp">

        <div class="card-name">
            UID TopUp<br>(BD)
        </div>

    </div>


    <!-- 2 Weekly Monthly -->
    <div class="card" onclick="openPage('weekly-monthly.html')">

        <img src="weekly-monthly.jpg" alt="Weekly Monthly">

        <div class="card-name">
            Weekly/Monthly<br>Offer
        </div>

    </div>


    <!-- 3 Weekly Lite -->
    <div class="card" onclick="openPage('weekly-lite.html')">

        <img src="weekly-lite.jpg" alt="Weekly Lite">

        <div class="card-name">
            Weekly Lite<br>(BD Server)
        </div>

    </div>


    <!-- 4 Level Up Pass -->
    <div class="card" onclick="openPage('level-up-pass.html')">

        <img src="level-up-pass.jpg" alt="Level Up Pass">

        <div class="card-name">
            Level Up Pass
        </div>

    </div>


    <!-- 5 FF Likes -->
    <div class="card" onclick="openPage('ff-likes.html')">

        <img src="ff-likes.jpg" alt="FF Likes">

        <div class="card-name">
            FF Likes
        </div>

    </div>


    <!-- 6 Indonesia Server -->
    <div class="card" onclick="openPage('indonesia.html')">

        <img src="indonesia.jpg" alt="Indonesia Server">

        <div class="card-name">
            Indonesia<br>Server
        </div>

    </div>

</div>


<script>
function openPage(page){
    window.location.href = page;
}
</script>

</body>
</html>
