<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FF TOPUP</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f7ff;
    color:#111;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:25px 15px 50px;
}

.title{
    text-align:center;
    font-size:48px;
    font-weight:900;
    color:#173b68;
    margin:10px 0 35px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:28px;
}

.card{
    background:#fff;
    border-radius:25px;
    overflow:hidden;
    text-align:center;
    border:2px solid #e5e5e5;
    box-shadow:0 8px 20px rgba(0,0,0,.10);
}

.card img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
}

.card h2{
    margin:18px 10px 25px;
    font-size:25px;
}

@media(max-width:800px){
    .cards{
        grid-template-columns:repeat(2,1fr);
        gap:18px;
    }

    .title{
        font-size:38px;
    }

    .card h2{
        font-size:20px;
    }
}

@media(max-width:500px){
    .cards{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .container{
        padding:18px 10px 40px;
    }

    .title{
        font-size:32px;
        margin-bottom:25px;
    }

    .card{
        border-radius:18px;
    }

    .card h2{
        font-size:17px;
        margin:12px 5px 18px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="title">FF TOPUP</div>

    <div class="cards">

        <!-- 1 -->
        <div class="card">
            <img src="uid-topup.jpg" alt="UID TopUp">
            <h2>UID TopUp (BD)</h2>
        </div>

        <!-- 2 -->
        <div class="card">
            <img src="weekly-monthly.jpg" alt="Weekly Monthly">
            <h2>Weekly/Monthly Offer</h2>
        </div>

        <!-- 3 -->
        <div class="card">
            <img src="weekly-lite.jpg" alt="Weekly Lite">
            <h2>Weekly Lite (BD Server)</h2>
        </div>

        <!-- 4 -->
        <div class="card">
            <img src="level-up-pass.jpg" alt="Level Up Pass">
            <h2>Level Up Pass</h2>
        </div>

        <!-- 5 -->
        <div class="card">
            <img src="ff-likes.jpg" alt="FF Likes">
            <h2>FF Likes</h2>
        </div>

        <!-- 6 -->
        <div class="card">
            <img src="indonesia.jpg" alt="Indonesia Server">
            <h2>Indonesia Server</h2>
        </div>

    </div>
</div>

</body>
</html>
