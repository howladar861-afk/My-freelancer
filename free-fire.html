<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free Fire</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#eef2ff;
    padding:20px 12px 40px;
}

.title{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    color:#111827;
    margin:15px 0 25px;
}

.cards{
    max-width:650px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.card{
    min-height:170px;
    background:white;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px 10px;
    font-size:21px;
    font-weight:bold;
    color:#111827;
    box-shadow:0 8px 20px rgba(0,0,0,0.12);
    border:2px solid #e5e7eb;
    cursor:pointer;
    transition:0.2s;
}

.card:active{
    transform:scale(0.95);
}

.card:hover{
    transform:translateY(-4px);
}

.icon{
    font-size:42px;
    margin-bottom:12px;
}

.card-content{
    display:flex;
    flex-direction:column;
    align-items:center;
}

@media(max-width:500px){
    .cards{
        grid-template-columns:1fr;
    }

    .card{
        min-height:155px;
        font-size:23px;
    }
}
</style>
</head>

<body>

<h1 class="title">🔥 FREE FIRE 🔥</h1>

<div class="cards">

    <div class="card" onclick="openPage('uid-topup.html')">
        <div class="card-content">
            <div class="icon">💎</div>
            <div>UID TopUp<br>(BD)</div>
        </div>
    </div>

    <div class="card" onclick="openPage('weekly-monthly.html')">
        <div class="card-content">
            <div class="icon">🎁</div>
            <div>Weekly / Monthly<br>Offer</div>
        </div>
    </div>

    <div class="card" onclick="openPage('weekly-lite.html')">
        <div class="card-content">
            <div class="icon">⚡</div>
            <div>Weekly Lite<br>(BD Server)</div>
        </div>
    </div>

    <div class="card" onclick="openPage('level-up-pass.html')">
        <div class="card-content">
            <div class="icon">🎫</div>
            <div>Level Up Pass</div>
        </div>
    </div>

    <div class="card" onclick="openPage('ff-likes.html')">
        <div class="card-content">
            <div class="icon">❤️</div>
            <div>FF Likes</div>
        </div>
    </div>

    <div class="card" onclick="openPage('indonesia.html')">
        <div class="card-content">
            <div class="icon">🌐</div>
            <div>Indonesia<br>Server</div>
        </div>
    </div>

</div>

<script>
function openPage(page){
    window.location.href = page;
}
</script>

</body>
</html>
