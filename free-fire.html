<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FF TOPUP</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f4f7ff;
    font-family:Arial,sans-serif;
    padding:20px 12px 40px;
}

.title{
    text-align:center;
    color:#173f70;
    font-size:44px;
    font-weight:800;
    margin:10px 0 35px;
}

.cards{
    width:100%;
    max-width:720px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.card{
    background:#fff;
    border:2px solid #e3e3e3;
    border-radius:24px;
    overflow:hidden;
    text-align:center;
    box-shadow:0 5px 18px rgba(0,0,0,.12);
    cursor:pointer;
}

.card:active{
    transform:scale(.97);
}

.card img{
    width:100%;
    height:190px;
    object-fit:cover;
    display:block;
}

.card-name{
    min-height:85px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
    font-size:21px;
    font-weight:700;
    line-height:1.3;
    color:#111;
}

@media(max-width:500px){

    .title{
        font-size:40px;
    }

    .cards{
        gap:12px;
    }

    .card img{
        height:160px;
    }

    .card-name{
        min-height:78px;
        font-size:18px;
    }
}
    .card img{
  width:100%;
  height:190px;
  object-fit:cover;
  display:block;
    }
</style>
</head>

<body>

<h1 class="title">FF TOPUP</h1>

<div class="cards">

<!-- UID TOPUP -->
<div class="card" onclick="openPage('uid-topup.html')">

  <img src="IMG-20260915-WA0034~3.jpg" alt="UID Top Up">
  </div>

</div>


<!-- WEEKLY MONTHLY -->
<div class="card" onclick="openPage('weekly-monthly.html')">
    <img src="IMG-20260915-WA0034--8.jpg" alt="Weekly Monthly">
    <div class="card-name">
        Weekly/Monthly<br>Offer
    </div>
</div>


<!-- WEEKLY LITE -->
<div class="card" onclick="openPage('weekly-lite.html')">
    <img src="IMG-20260915-WA0034--5.jpg" alt="Weekly Lite">
    <div class="card-name">
        Weekly Lite<br>(BD Server)
    </div>
</div>


<!-- LEVEL UP PASS -->
<div class="card" onclick="openPage('level-up-pass.html')">
    <img src="IMG-20260915-WA0034--6.jpg" alt="Level Up Pass">
    <div class="card-name">
        Level Up Pass
    </div>
</div>


<!-- FF LIKES -->
<div class="card" onclick="openPage('ff-likes.html')">
    <img src="IMG-20260915-WA0034--7.jpg" alt="FF Likes">
    <div class="card-name">
        FF Likes
    </div>
</div>


<!-- INDONESIA SERVER -->
<div class="card" onclick="openPage('indonesia.html')">
 <img src="indonesia.jpg" alt="Indonesia Server">
    <div class="card-name">
        Indonesia<br>Server
    </div>
</div>

</div>

<script>
function openPage(page){
    window.location.href = page;
}
</script>

</body>
</html>
