<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>May Network</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .header {
      background: #2563eb;
      color: white;
      padding: 18px 12px;
      text-align: center;
      font-size: 25px;
      font-weight: bold;
    }

    .container {
      width: 92%;
      max-width: 650px;
      margin: 20px auto 80px;
    }

    .search-box {
      background: white;
      padding: 22px;
      border-radius: 20px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.10);
    }

    .search-box h2 {
      text-align: center;
      margin: 0 0 20px;
      line-height: 1.4;
      font-size: 24px;
    }

    .search-box input {
      width: 100%;
      padding: 15px;
      border: 2px solid #d1d5db;
      border-radius: 12px;
      font-size: 17px;
      outline: none;
      margin-bottom: 12px;
    }

    .search-box input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      color: white;
    }

    .search-btn {
      background: #2563eb;
    }

    .search-btn:active {
      transform: scale(0.98);
    }

    .search-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .back-btn {
      margin-top: 20px;
      background: #4b5563;
    }

    #result {
      margin-top: 18px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 15px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    .owner-card {
      border-left: 6px solid #f59e0b;
    }

    .member-card {
      border-left: 6px solid #16a34a;
    }

    .login-card {
      border-left: 6px solid #dc2626;
    }

    .info {
      margin: 9px 0;
      line-height: 1.5;
      word-break: break-word;
    }

    .owner-title {
      margin-top: 0;
      color: #92400e;
    }

    .member-title {
      margin-top: 0;
      color: #166534;
    }

    .verified {
      display: inline-block;
      background: #dcfce7;
      color: #15803d;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .not-verified {
      display: inline-block;
      background: #fee2e2;
      color: #dc2626;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .count {
      background: #e0e7ff;
      color: #3730a3;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .message {
      background: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
    }

    .error {
      color: #dc2626;
    }

    .success {
      color: #15803d;
    }

    .loading {
      color: #2563eb;
    }

    .section-title {
      font-size: 22px;
      margin: 20px 0 12px;
    }

    .small {
      color: #6b7280;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="header">
    🌐 May Network
  </div>

  <div class="container">

    <!-- =====================================
         SEARCH BOX
    ====================================== -->

    <div class="search-box">

      <h2>
        🔎 Referral Code দিয়ে Search
      </h2>

      <input
        type="text"
        id="referralSearch"
        placeholder="যেমন: EWOTFP"
        autocomplete="off"
      >

      <button
        type="button"
        id="searchBtn"
        class="search-btn">
        🔍 Search
      </button>

    </div>


    <!-- =====================================
         RESULT
    ====================================== -->

    <div id="result">

      <div class="message">
        🔐 Referral Network দেখতে Referral Code লিখে Search করুন।
      </div>

    </div>


    <!-- =====================================
         BACK BUTTON
    ====================================== -->

    <button
      type="button"
      class="back-btn"
      onclick="window.location.href='dashboard.html'">

      ⬅️ Back

    </button>

  </div>


  <!-- =======================================
       FIREBASE
  ======================================== -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


    import {
      getFirestore,
      collection,
      query,
      where,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    /* =====================================
       FIREBASE CONFIG
    ====================================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyBFUKPT7fo6sUofdO09ffiZgjdlaR5evm8",

      authDomain:
        "rakib-freelancer-9c66b.firebaseapp.com",

      projectId:
        "rakib-freelancer-9c66b",

      storageBucket:
        "rakib-freelancer-9c66b.firebasestorage.app",

      messagingSenderId:
        "541209844482",

      appId:
        "1:541209844482:web:510568d5226c9bf47ac01b"
    };


    /* =====================================
       INITIALIZE
    ====================================== */

    const app =
      initializeApp(firebaseConfig);

    const db =
      getFirestore(app);

    const auth =
      getAuth(app);


    /* =====================================
       ELEMENTS
    ====================================== */

    const searchInput =
      document.getElementById("referralSearch");

    const searchBtn =
      document.getElementById("searchBtn");

    const result =
      document.getElementById("result");


    /* =====================================
       CURRENT USER
    ====================================== */

    let currentUser = null;


    /*
      Firebase Auth ready হওয়া পর্যন্ত
      অপেক্ষা করবে।
    */

    onAuthStateChanged(auth, (user) => {

      currentUser = user;

    });


    /* =====================================
       SEARCH BUTTON
    ====================================== */

    searchBtn.addEventListener(
      "click",
      searchNetwork
    );


    /* =====================================
       ENTER KEY
    ====================================== */

    searchInput.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "Enter") {

          event.preventDefault();

          searchNetwork();

        }

      }
    );


    /* =====================================
       MAIN SEARCH FUNCTION
    ====================================== */

    async function searchNetwork() {

      const referralCode =
        searchInput.value
          .trim()
          .toUpperCase();


      /* =================================
         EMPTY CODE
      ================================= */

      if (!referralCode) {

        result.innerHTML = `
          <div class="message error">
            ❌ Referral Code লিখুন।
          </div>
        `;

        searchInput.focus();

        return;
      }


      /* =================================
         LOGIN CHECK
      ================================= */

      if (!currentUser) {

        result.innerHTML = `
          <div class="card login-card">

            <h3>🔐 Login প্রয়োজন</h3>

            <div class="info">
              Referral Network দেখতে হলে
              আগে আপনার Account-এ Login করতে হবে।
            </div>

          </div>
        `;

        return;
      }


      /* =================================
         LOADING
      ================================= */

      searchBtn.disabled = true;

      searchBtn.innerText =
        "🔄 Searching...";


      result.innerHTML = `
        <div class="message loading">
          🔄 Referral Network খোঁজা হচ্ছে...
        </div>
      `;


      try {

        /* =================================
           1. FIND REFERRAL OWNER
        ================================= */

        const ownerQuery =
          query(
            collection(db, "users"),
            where(
              "referralCode",
              "==",
              referralCode
            )
          );


        const ownerSnapshot =
          await getDocs(ownerQuery);


        let ownerName =
          "নাম পাওয়া যায়নি";


        let ownerEmail =
          "Email পাওয়া যায়নি";


        let ownerCode =
          referralCode;


        let ownerHTML = "";


        if (!ownerSnapshot.empty) {

          const owner =
            ownerSnapshot.docs[0].data();


          ownerName =
            owner.name || "নাম নেই";


          ownerEmail =
            owner.email || "Email নেই";


          ownerCode =
            owner.referralCode || referralCode;


          const ownerJoinDate =
  formatDate(
    owner.createdAt ||
    owner.joinedAt ||
    owner.registrationDate ||
    owner.created_at
  );

const ownerVerified =
  owner.verified === true;

ownerHTML = `

  <div class="card owner-card">

    <h2 class="owner-title">
      👑 Referral Owner
    </h2>

    <div class="info">
      👤 <b>নাম:</b>
      ${escapeHtml(ownerName)}
    </div>

    <div class="info">
      📧 <b>Gmail:</b>
      ${escapeHtml(ownerEmail)}
    </div>

    <div class="info">
      🔑 <b>Referral Code:</b>
      ${escapeHtml(ownerCode)}
    </div>

    <div class="info">
      📅 <b>Registration Date:</b>
      ${escapeHtml(ownerJoinDate)}
    </div>

    <div class="info">
      🔐 <b>Verification Status:</b>
      ${
        ownerVerified
        ? "✅ Verified"
        : "❌ Not Verified"
      }
    </div>

  </div>

`;
        }

        else {

          ownerHTML = `

            <div class="message error">

              ⚠️ এই Referral Code-এর
              কোনো Owner পাওয়া যায়নি।

            </div>

          `;

        }


        /* =================================
           2. FIND ALL REGISTERED MEMBERS
        ================================= */

        /*
          এখানে শুধু referredBy দিয়ে search করছি।

          তাই Firestore Composite Index
          সাধারণত প্রয়োজন হবে না।

          Verified status JavaScript দিয়ে
          আলাদা করে দেখানো হবে।
        */

        const memberQuery =
          query(
            collection(db, "users"),
            where(
              "referredBy",
              "==",
              referralCode
            )
          );


        const memberSnapshot =
          await getDocs(memberQuery);


        /* =================================
           3. MEMBER COUNT
        ================================= */

        const totalMembers =
          memberSnapshot.size;


        let verifiedCount = 0;

        let unverifiedCount = 0;


        memberSnapshot.forEach((doc) => {

          const member =
            doc.data();


          if (member.verified === true) {

            verifiedCount++;

          } else {

            unverifiedCount++;

          }

        });


        /* =================================
           4. MEMBER HTML
        ================================= */

        let membersHTML = "";


        if (memberSnapshot.empty) {

          membersHTML = `

            <div class="message">

              ℹ️ এই Referral Code দিয়ে
              কোনো Member পাওয়া যায়নি।

            </div>

          `;

        }

        else {

          membersHTML = `

            <h2 class="section-title">
              👥 Registered Members
            </h2>

            <div class="count">

              মোট Member:
              ${totalMembers}
              &nbsp; | &nbsp;

              ✅ Verified:
              ${verifiedCount}
              &nbsp; | &nbsp;

              ❌ Not Verified:
              ${unverifiedCount}

            </div>

          `;


          memberSnapshot.forEach((doc) => {

            const member =
              doc.data();


            const isVerified =
              member.verified === true;


            /*
              Join date বিভিন্ন field থেকে
              নেওয়ার চেষ্টা করবে।
            */

            const joinDate =
              formatDate(
                member.joinedAt ||
                member.createdAt ||
                member.registrationDate ||
                member.created_at
              );

const verificationDate =
  formatDate(member.verifiedAt);
            membersHTML += `

              <div class="card member-card">

                <h3 class="member-title">

                  👤
                  ${escapeHtml(
                    member.name || "নাম নেই"
                  )}

                </h3>


                ${
                  isVerified

                  ?

                  `
                  <div class="verified">
                    ✅ Verified Member
                  </div>
                  `

                  :

                  `
                  <div class="not-verified">
                    ❌ Not Verified
                  </div>
                  `
                }


                <div class="info">

                  📧 <b>Gmail:</b>

                  ${escapeHtml(
                    member.email ||
                    "Email নেই"
                  )}

                </div>


                <div class="info">

                  👤 <b>নাম:</b>

                  ${escapeHtml(
                    member.name ||
                    "নাম নেই"
                  )}

                </div>


                <div class="info">

                  📅 <b>Join Date:</b>

                  ${escapeHtml(joinDate)}

                </div>
<div class="info">

  🕐 <b>Verification Date:</b>

  ${escapeHtml(verificationDate)}

</div>

                <div class="info">

                  🔑 <b>যে Referral Code দিয়ে
                  Account করেছে:</b>

                  ${escapeHtml(
                    member.referredBy ||
                    "Referral Code নেই"
                  )}

                </div>


                <div class="info">

                  🆔 <b>Member-এর নিজের
                  Referral Code:</b>

                  ${escapeHtml(
                    member.referralCode ||
                    "Referral Code নেই"
                  )}

                </div>


                <div class="info">

                  🔐 <b>Verification Status:</b>

                  ${
                    isVerified
                    ? "Verified"
                    : "Not Verified"
                  }

                </div>


                <div class="info">

                  👑 <b>Referrer:</b>

                  ${escapeHtml(
                    ownerName
                  )}

                </div>

              </div>

            `;

          });

        }


        /* =================================
           5. SHOW EVERYTHING
        ================================= */

        result.innerHTML =
          ownerHTML +
          membersHTML;


      }

      catch (error) {

        console.error(
          "May Network Error:",
          error
        );


        result.innerHTML = `

          <div class="message error">

            ❌ Network লোড করা যায়নি।

            <br><br>

            <b>Error:</b>

            ${escapeHtml(
              error.message ||
              "Unknown error"
            )}

          </div>

        `;

      }


      finally {

        searchBtn.disabled = false;

        searchBtn.innerText =
          "🔍 Search";

      }

    }


    /* =====================================
       DATE FORMAT
    ====================================== */

    function formatDate(value) {

      if (!value) {

        return "তারিখ পাওয়া যায়নি";

      }


      try {

        /*
          Firestore Timestamp
        */

        if (
          typeof value === "object" &&
          typeof value.toDate === "function"
        ) {

          return value
            .toDate()
            .toLocaleString(
              "bn-BD",
              {
                year: "numeric",
                month: "long",
                day: "numeric",
                hour: "numeric",
                minute: "2-digit"
              }
            );

        }


        /*
          Firebase Timestamp object
          { seconds: ... }
        */

        if (
          typeof value === "object" &&
          value.seconds
        ) {

          return new Date(
            value.seconds * 1000
          ).toLocaleString(
            "bn-BD",
            {
              year: "numeric",
              month: "long",
              day: "numeric",
              hour: "numeric",
              minute: "2-digit"
            }
          );

        }


        /*
          Normal Date/String
        */

        const date =
          new Date(value);


        if (
          !isNaN(
            date.getTime()
          )
        ) {

          return date.toLocaleString(
            "bn-BD",
            {
              year: "numeric",
              month: "long",
              day: "numeric",
              hour: "numeric",
              minute: "2-digit"
            }
          );

        }


        return String(value);

      }

      catch (error) {

        return String(value);

      }

    }


    /* =====================================
       HTML SECURITY
    ====================================== */

    function escapeHtml(value) {

      return String(value)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }

  </script>

</body>
  </html>
