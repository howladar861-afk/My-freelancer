<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>বাংলালিংক অফার - রাকিব ফ্রিল্যান্সার</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#fff;
    color:#222;
}

/* HEADER */
.header{
    background:#d21b91;
    color:white;
    padding:18px 15px 12px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:28px;
}

.header p{
    margin:8px 0 0;
    font-size:16px;
}

/* SEARCH */
.search-box{
    margin:15px 20px;
    height:62px;
    background:white;
    border-radius:18px;
    display:flex;
    align-items:center;
    padding:0 15px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.logo{
    font-size:40px;
    margin-right:15px;
}

.search-text{
    flex:1;
    font-size:28px;
    color:#777;
}

.search-icon{
    font-size:38px;
    color:#d21b91;
}

/* CATEGORY */
.categories{
    display:flex;
    justify-content:space-around;
    align-items:center;
    overflow:hidden;
    padding:8px 5px 12px;
    background:#d21b91;
    color:white;
}

.categories div{
    font-size:17px;
    white-space:nowrap;
    padding:8px 7px;
}

.categories .active{
    color:#ffe900;
    border-bottom:4px solid #ffe900;
}

/* EMPTY OFFER AREA */
.offer-area{
    min-height:650px;
    text-align:center;
    padding:100px 25px 40px;
}

.empty-icon{
    font-size:90px;
    opacity:.25;
    margin-bottom:25px;
}

.offer-area h2{
    color:#d21b91;
    font-size:22px;
    margin:15px 0;
}

.offer-area p{
    color:#777;
    font-size:17px;
    line-height:1.7;
    margin:5px 0;
}

/* MOBILE */
@media(max-width:380px){
    .header h1{
        font-size:24px;
    }

    .categories div{
        font-size:14px;
    }

    .offer-area h2{
        font-size:20px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">
    <h1>বাংলালিংক অফার</h1>
    <p>রাকিব ফ্রিল্যান্সার</p>
</header>

<!-- SEARCH -->
<div class="search-box">
    <div class="logo">🅱️</div>
    <div class="search-text">Search</div>
    <div class="search-icon">⌕</div>
</div>

<!-- CATEGORY -->
<div class="categories">
    <div class="active">All</div>
    <div>Minutes</div>
    <div>Internet</div>
    <div>Bundles</div>
    <div>Call Rate</div>
</div>

<!-- OFFER AREA -->
<div class="offer-area">

    <div class="empty-icon">🎁</div>

    <h2>
        বাংলালিংক এর অফারগুলো শীঘ্রই যোগ করা হবে
    </h2>

    <p>
        আমরা আপনার জন্য সেরা অফার নিয়ে আসছি।
    </p>

    <p>
        অনুগ্রহ করে কিছুক্ষণ অপেক্ষা করুন।
    </p>

</div>

</body>
</html>
