<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Freelancer - Reselling</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:15px;
  background:#f2f4f8;
  font-family:Arial,sans-serif;
  color:#222;
}
.container{
  max-width:600px;
  margin:auto;
  background:white;
  padding:22px;
  border-radius:20px;
}
h2{text-align:center;color:#087b49}
label{
  display:block;
  font-size:18px;
  font-weight:bold;
  margin-top:20px;
}
input,select,textarea{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:17px;
}
textarea{height:110px}
.total{
  background:#e6f7ee;
  padding:18px;
  border-radius:15px;
  margin-top:25px;
  font-size:19px;
  font-weight:bold;
  line-height:1.7;
}
button{
  width:100%;
  padding:16px;
  margin-top:18px;
  border:0;
  border-radius:12px;
  font-size:19px;
  cursor:pointer;
}
.confirm{background:#087b49;color:white}
.back{background:#555;color:white}
.history{background:#2563eb;color:white}
#popup{
  display:none;
  position:fixed;
  inset:0;
  background:#0009;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.popup-box{
  background:white;
  color:#222;
  padding:25px;
  border-radius:18px;
  width:100%;
  max-width:400px;
  text-align:center;
}
.popup-box button{font-size:16px}
.order-item{
  background:#f1f5f9;
  padding:15px;
  border-radius:12px;
  margin-top:12px;
  line-height:1.8;
}
</style>
</head>

<body>

<div class="container">

<h2>🛍️ My Freelancer Reselling</h2>

<label>পণ্যের নাম</label>
<input id="productName" value="My Freelancer Product" readonly>

<label>পণ্যের দাম</label>
<input id="productPrice" type="number" value="10000" readonly>

<label>আপনার নাম</label>
<input id="customerName" placeholder="আপনার নাম লিখুন">

<label>মোবাইল নম্বর</label>
<input id="phone" type="tel" placeholder="01XXXXXXXXX">

<label>জেলা</label>
<input id="district" placeholder="আপনার জেলা">

<label>সম্পূর্ণ ঠিকানা</label>
<textarea id="address" placeholder="বাড়ি, গ্রাম, থানা ও ঠিকানা"></textarea>

<label>ডেলিভারি এলাকা</label>
<select id="deliveryArea">
  <option value="70">ঢাকার ভিতরে - ৳70</option>
  <option value="130">ঢাকার বাইরে - ৳130</option>
</select>

<label>পরিমাণ</label>
<input id="quantity" type="number" value="1" min="1">

<div class="total" id="totalBox">
  পণ্যের দাম: ৳10000<br>
  ডেলিভারি: ৳70<br>
  সর্বমোট: ৳10070
</div>

<p>💵 পেমেন্ট: Cash on Delivery</p>
<p>পণ্য হাতে পেয়ে টাকা পরিশোধ করবেন।</p>

<button class="confirm" id="confirmBtn">
অর্ডার কনফার্ম করুন
</button>

<button class="history" onclick="showHistory()">
📦 আমার অর্ডার
</button>

<button class="back" onclick="history.back()">
ফিরে যান
</button>

<div id="historyBox"></div>

</div>

<!-- Confirmation Popup -->
<div id="popup">
  <div class="popup-box">
    <h2>🛍️ অর্ডার নিশ্চিত করুন</h2>
    <p id="popupDetails"></p>
    <button class="confirm" id="finalConfirm">
      হ্যাঁ, অর্ডার করুন
    </button>
    <button class="back" onclick="closePopup()">
      বাতিল
    </button>
  </div>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
 getAuth,
 onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
 getFirestore,
 collection,
 addDoc,
 query,
 where,
 getDocs,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyBFUKPT7fo6sUofdO09ffiZgjdlaR5evm8",
 authDomain: "rakib-freelancer-9c66b.firebaseapp.com",
 projectId: "rakib-freelancer-9c66b",
 storageBucket: "rakib-freelancer-9c66b.firebasestorage.app",
 messagingSenderId: "541209844482",
 appId: "1:541209844482:web:510568d5226c9bf47ac01b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const PRICE = 10000;
let currentUser = null;

onAuthStateChanged(auth, user => {
 currentUser = user;

 if(!user){
   alert("অর্ডার করতে আগে Login করুন।");
 }
});

// হিসাব
function calculateTotal(){

 const quantity = Math.max(
   1,
   Number(document.getElementById("quantity").value) || 1
 );

 const delivery = Number(
   document.getElementById("deliveryArea").value
 );

 const productTotal = PRICE * quantity;
 const total = productTotal + delivery;

 document.getElementById("totalBox").innerHTML =
 `পণ্যের দাম: ৳${productTotal}<br>
 ডেলিভারি: ৳${delivery}<br>
 সর্বমোট: ৳${total}`;

 return {quantity,delivery,productTotal,total};
}

document.getElementById("quantity")
.addEventListener("input",calculateTotal);

document.getElementById("deliveryArea")
.addEventListener("change",calculateTotal);

// Popup
document.getElementById("confirmBtn").onclick = () => {

 if(!currentUser){
   alert("আগে Login করুন।");
   return;
 }

 const name = document.getElementById("customerName").value.trim();
 const phone = document.getElementById("phone").value.trim();
 const district = document.getElementById("district").value.trim();
 const address = document.getElementById("address").value.trim();

 if(!name || !phone || !district || !address){
   alert("সব তথ্য পূরণ করুন।");
   return;
 }

 const bill = calculateTotal();

 document.getElementById("popupDetails").innerHTML =
 `নাম: ${name}<br>
 মোবাইল: ${phone}<br>
 জেলা: ${district}<br>
 পরিমাণ: ${bill.quantity}<br>
 সর্বমোট: ৳${bill.total}<br>
 পেমেন্ট: Cash on Delivery`;

 document.getElementById("popup").style.display = "flex";
};

window.closePopup = function(){
 document.getElementById("popup").style.display = "none";
};

// অর্ডার Firebase-এ জমা
document.getElementById("finalConfirm").onclick =
async function(){

 const btn = this;
 if(!currentUser) return;

 btn.disabled = true;
 btn.textContent = "অর্ডার জমা হচ্ছে...";

 try{

 const bill = calculateTotal();

 await addDoc(collection(db,"reselling_orders"),{

   userId: currentUser.uid,
   userName: document.getElementById("customerName").value.trim(),
   email: currentUser.email || "",

   productName: "My Freelancer Product",
   productPrice: PRICE,

   phone: document.getElementById("phone").value.trim(),
   district: document.getElementById("district").value.trim(),
   address: document.getElementById("address").value.trim(),

   deliveryArea:
     bill.delivery === 70 ? "ঢাকার ভিতরে" : "ঢাকার বাইরে",

   deliveryCharge: bill.delivery,
   quantity: bill.quantity,
   productTotal: bill.productTotal,
   totalAmount: bill.total,

   paymentMethod: "Cash on Delivery",

   status: "pending",
   createdAt: serverTimestamp()

 });

 closePopup();

 alert("✅ আপনার অর্ডার সফলভাবে জমা হয়েছে!");

 document.getElementById("historyBox").innerHTML = "";

 }catch(error){

 console.error(error);
 alert("অর্ডার জমা হয়নি: " + error.message);

 }finally{

 btn.disabled = false;
 btn.textContent = "হ্যাঁ, অর্ডার করুন";

 }
};

// অর্ডারের ইতিহাস
window.showHistory = async function(){

 const box = document.getElementById("historyBox");

 if(!currentUser){
   alert("আগে Login করুন।");
   return;
 }

 box.innerHTML = "<p>অর্ডার লোড হচ্ছে...</p>";

 try{

 const q = query(
   collection(db,"reselling_orders"),
   where("userId","==",currentUser.uid)
 );

 const snapshot = await getDocs(q);

 box.innerHTML = "<h3>📦 অর্ডারের ইতিহাস</h3>";

 if(snapshot.empty){
   box.innerHTML += "<p>কোনো অর্ডার নেই।</p>";
   return;
 }

 snapshot.forEach(orderDoc => {

   const data = orderDoc.data();

   const item = document.createElement("div");
   item.className = "order-item";

   const statusNames = {
     pending: "পেন্ডিং",
     delivery: "ডেলিভারি চলছে",
     confirmed: "কনফার্ম"
   };

   item.textContent =
     "পণ্য: " + (data.productName || "") +
     " | মোট: ৳" + (data.totalAmount || 0) +
     " | অবস্থা: " +
     (statusNames[data.status] || data.status);

   box.appendChild(item);

 });

 }catch(error){

 box.textContent = "অর্ডার লোড করা যায়নি: " + error.message;

 }

};

calculateTotal();

</script>
</body>
</html>
