<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>এয়ারটেল অফার - রাকিব ফ্রিল্যান্সার</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        /* HEADER */
        .header {
            background: #e6007e;
            color: white;
            text-align: center;
            padding: 22px 10px;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 20px;
        }

        /* SEARCH */
        .search-box {
            background: white;
            margin: 20px;
            padding: 18px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        .search-box input {
            width: 100%;
            border: 0;
            outline: none;
            font-size: 22px;
            padding: 8px;
        }

        /* CATEGORIES */
        .categories {
            display: flex;
            overflow-x: auto;
            background: #e6007e;
            padding: 15px 10px;
            gap: 30px;
        }

        .categories div {
            color: white;
            font-size: 18px;
            white-space: nowrap;
        }

        .categories .active {
            color: yellow;
            font-weight: bold;
        }

        /* EMPTY OFFER */
        .empty-offer {
            text-align: center;
            padding: 100px 20px;
            background: white;
            min-height: 500px;
        }

        .empty-icon {
            font-size: 90px;
            margin-bottom: 30px;
        }

        .empty-offer h2 {
            color: #e6007e;
            font-size: 27px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .empty-offer p {
            color: #777;
            font-size: 19px;
            line-height: 1.8;
        }

        /* FOOTER */
        .footer {
            text-align: center;
            padding: 20px;
            background: #e6007e;
            color: white;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <div class="header">
        <h1>এয়ারটেল অফার</h1>
        <p>রাকিব ফ্রিল্যান্সার</p>
    </div>


    <!-- SEARCH -->
    <div class="search-box">
        <input
            type="text"
            placeholder="🔍 Search"
            disabled>
    </div>


    <!-- CATEGORIES -->
    <div class="categories">
        <div class="active">All</div>
        <div>Minutes</div>
        <div>Internet</div>
        <div>Bundles</div>
        <div>Call Rate</div>
    </div>


    <!-- OFFER AREA -->
    <div class="empty-offer">

        <div class="empty-icon">
            🎁
        </div>

        <h2>
            এয়ারটেল এর অফারগুলো শীঘ্রই<br>
            যোগ করা হবে
        </h2>

        <p>
            আমরা আপনার জন্য সেরা অফার নিয়ে আসছি।
        </p>

        <p>
            অনুগ্রহ করে কিছুক্ষণ অপেক্ষা করুন।
        </p>

    </div>


    <!-- FOOTER -->
    <div class="footer">
        Rakib Freelancer © 2026
    </div>

</body>
</html>
