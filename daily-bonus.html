<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Daily Bonus</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef5ff;
      color: #111;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 30px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,.10);
    }

    .title {
      font-size: 38px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .gift {
      background: #2867d7;
      color: #ffd900;
      border-radius: 50px;
      padding: 25px;
      font-size: 55px;
      font-weight: bold;
    }

    .sub {
      font-size: 25px;
      margin-top: 25px;
    }

    .section {
      background: #eaf3ff;
      border-radius: 30px;
      padding: 30px 20px;
      margin-top: 20px;
    }

    .section-title {
      display: inline-block;
      background: #2867d7;
      color: white;
      border-radius: 25px;
      padding: 18px 45px;
      font-size: 32px;
      font-weight: bold;
    }

    #dailyReferralCount {
      font-size: 60px;
      color: #1762d2;
      font-weight: bold;
      margin: 35px 0 20px;
    }

    #dailyReferralTimer {
      background: white;
      border-radius: 30px;
      padding: 25px;
      font-size: 28px;
      font-weight: bold;
      color: #1762d2;
      box-shadow: 0 5px 15px rgba(0,0,0,.08);
    }

    #bonusStatus {
      margin-top: 25px;
      padding: 20px;
      border-radius: 25px;
      font-size: 25px;
      font-weight: bold;
      background: #effff4;
      color: #16823b;
    }

    .login {
      background: white;
      border-radius: 25px;
      padding: 25px;
      margin-top: 20px;
      font-size: 28px;
      font-weight: bold;
    }

    .help {
      background: white;
      border-radius: 25px;
      padding: 25px;
      margin-top: 20px;
      font-size: 22px;
    }

    #errorBox {
      display: none;
      background: #ffe5e5;
      color: #c00;
      padding: 15px;
      border-radius: 15px;
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="title">
      প্রতিদিন ৪টা রেফার করলে
    </div>

    <div class="gift">
      🎁 ২০ টাকা 🎁
    </div>

    <div class="sub">
      বোনাস পাওয়া যাবে
    </div>

  </div>


  <div class="section">

    <div class="section-title">
      রেফার কাউন্ট
    </div>

    <div id="dailyReferralCount">
      0 / 4
    </div>

    <div id="dailyReferralTimer">
      ⏳ সময় হিসাব করা হচ্ছে...
    </div>

    <div style="font-size:22px;margin-top:25px;">
      আজকের রেফার কাউন্ট
    </div>

  </div>


  <div id="bonusStatus">
    ⏳ ৪টি রেফার পূর্ণ করুন
  </div>


  <div id="loginStatus" class="login">
    🔄 লগইন যাচাই করা হচ্ছে...
  </div>


  <div id="errorBox"></div>


  <div class="help">
    📱 01837976455 (WhatsApp)
    <br>
    <small>এডমিন এর সাথে যোগাযোগ করুন</small>
  </div>

</div>


<!-- Firebase + Daily Referral -->

<script type="module">

  import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

  import { getFirestore }
  from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

  import {
    getAuth,
    onAuthStateChanged
  }
  from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

  import {
    getDailyReferralStatus
  }
  from "./dailyReferral.js";


  /* =========================
     FIREBASE CONFIG
  ========================= */

  const firebaseConfig = {

    apiKey: "AIzaSyBFUKPT7fo6sUofd009ffiZgjdlaR5Evm8",

    authDomain:
      "rakib-freelancer-9c66b.firebaseapp.com",

    projectId:
      "rakib-freelancer-9c66b",

    storageBucket:
      "rakib-freelancer-9c66b.firebasestorage.app",

    messagingSenderId:
      "541209844482",

    appId:
      "1:541209844482:web:510568d5226c9bf47ac01b",

    measurementId:
      "G-F6QNE0QN5K"
  };


  /* =========================
     FIREBASE START
  ========================= */

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  /* =========================
     ELEMENTS
  ========================= */

  const countElement =
    document.getElementById("dailyReferralCount");

  const bonusElement =
    document.getElementById("bonusStatus");

  const loginElement =
    document.getElementById("loginStatus");

  const errorElement =
    document.getElementById("errorBox");


  /* =========================
     LOAD DAILY STATUS
  ========================= */

  onAuthStateChanged(auth, async (user) => {

    if (!user) {

      loginElement.innerHTML =
        "🔒 আগে লগইন করুন";

      countElement.textContent =
        "0 / 4";

      bonusElement.textContent =
        "🔒 রেফার করতে আগে লগইন করুন";

      return;
    }


    loginElement.innerHTML =
      "✅ লগইন করা আছে";


    console.log("LOGIN UID:", user.uid);


    try {

      const status =
        await getDailyReferralStatus(
          db,
          user.uid
        );


      console.log(
        "DAILY STATUS:",
        status
      );


      /* =========================
         REFERRAL COUNT
      ========================= */

      const count =
        Number(status?.count ?? 0);

      const limit =
        Number(status?.limit ?? 4);


      countElement.textContent =
        count + " / " + limit;


      /* =========================
         BONUS STATUS
      ========================= */

      if (status?.completed) {

        bonusElement.textContent =
          "🎉 অভিনন্দন! আজকের ২০ টাকা বোনাস পাওয়ার যোগ্য হয়েছেন।";

      } else {

        const remaining =
          Math.max(
            0,
            limit - count
          );

        bonusElement.textContent =
          "⏳ আরও " +
          remaining +
          "টি রেফার পূর্ণ করুন";
      }



/* =========================
   CLOSE AUTH FUNCTION
========================= */

    } catch (error) {

      console.error("DAILY REFERRAL ERROR:", error);

      errorElement.style.display = "block";

      errorElement.textContent =
        "⚠️ তথ্য লোড করতে সমস্যা হয়েছে।";

    }

  });
/* =========================
   DAILY TIMER
========================= */

const timerElement =
  document.getElementById("dailyReferralTimer");

function updateDailyTimer() {
  if (!timerElement) return;

  const now = new Date();
  const tomorrow = new Date();

  tomorrow.setHours(24, 0, 0, 0);

  const remaining =
    Math.max(0, tomorrow.getTime() - now.getTime());

  const hours =
    Math.floor(remaining / 3600000);

  const minutes =
    Math.floor((remaining % 3600000) / 60000);

  const seconds =
    Math.floor((remaining % 60000) / 1000);

  timerElement.textContent =
    "⏳ সময় বাকি: " +
    String(hours).padStart(2, "0") + ":" +
    String(minutes).padStart(2, "0") + ":" +
    String(seconds).padStart(2, "0");
}

updateDailyTimer();
setInterval(updateDailyTimer, 1000);
</script>

</body>
</html>
