<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Bonus - Rakib Freelancer</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef5ff;
  color:#222;
}

.container{
  width:92%;
  max-width:650px;
  margin:25px auto;
}

.card{
  background:#fff;
  border-radius:28px;
  padding:28px 20px;
  margin-bottom:25px;
  text-align:center;
  box-shadow:0 5px 20px rgba(0,0,0,.10);
}

.title{
  font-size:28px;
  font-weight:800;
  margin-bottom:20px;
}

.money{
  background:#2467d8;
  color:#ffd900;
  border-radius:55px;
  padding:22px 10px;
  font-size:42px;
  font-weight:900;
}

.subtitle{
  font-size:22px;
  margin-top:30px;
}

.referral-box{
  background:#edf5ff;
  border-radius:28px;
  padding:35px 15px;
  text-align:center;
}

.referral-title{
  display:inline-block;
  background:#2467d8;
  color:white;
  padding:16px 55px;
  border-radius:22px;
  font-size:28px;
  font-weight:800;
}

.count{
  color:#1760d8;
  font-size:58px;
  font-weight:900;
  margin:55px 0 25px;
}

.timer{
  background:white;
  border-radius:28px;
  padding:22px 10px;
  color:#1760d8;
  font-size:25px;
  font-weight:800;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.small-title{
  font-size:22px;
  margin-top:35px;
}

.status{
  margin-top:35px;
  padding:20px;
  border:4px solid #91d9ad;
  border-radius:25px;
  background:#effff4;
  color:#16883d;
  font-size:24px;
  font-weight:800;
}

.help{
  background:white;
  border-radius:25px;
  padding:25px;
  text-align:center;
  font-size:21px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.error{
  color:#d00000;
  font-size:17px;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="title">
      প্রতিদিন ৪টা রেফার করলে
    </div>

    <div class="money">
      🎁 ২০ টাকা 🎁
    </div>

    <div class="subtitle">
      বোনাস পাওয়া যাবে
    </div>

  </div>


  <div class="referral-box">

    <div class="referral-title">
      রেফার কাউন্ট
    </div>

    <div id="dailyReferralCount" class="count">
      0 / 4
    </div>

    <div id="dailyReferralTimer" class="timer">
      ⏳ সময় হিসাব করা হচ্ছে...
    </div>

    <div class="small-title">
      আজকের রেফার কাউন্ট
    </div>

    <div id="bonusStatus" class="status">
      ⏳ ৪টি রেফার পূর্ণ করুন
    </div>

  </div>


  <div class="help">
    📱 01837976455 (WhatsApp)
    <br>
    <small>এডমিন এর সাথে যোগাযোগ করুন</small>
  </div>

</div>


<script type="module">

/* =====================================
   FIREBASE IMPORT
===================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =====================================
   FIREBASE CONFIG
===================================== */

const firebaseConfig = {

  apiKey: "AIzaSyBFUKPT7fo6sUofd009ffiZgjdlaR5evm8",

  authDomain:
    "rakib-freelancer-9c66b.firebaseapp.com",

  projectId:
    "rakib-freelancer-9c66b",

  storageBucket:
    "rakib-freelancer-9c66b.firebasestorage.app",

  messagingSenderId:
    "541209844482",

  appId:
    "1:541209844482:web:510568d5226c9bf47ac01b",

  measurementId:
    "G-F6QNEOQN5K"
};


/* =====================================
   START FIREBASE
===================================== */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =====================================
   ELEMENTS
===================================== */

const countElement =
  document.getElementById("dailyReferralCount");

const timerElement =
  document.getElementById("dailyReferralTimer");

const bonusStatus =
  document.getElementById("bonusStatus");


/* =====================================
   USER LOGIN CHECK
===================================== */

onAuthStateChanged(auth, async (user) => {

  if (!user) {

    countElement.textContent = "0 / 4";

    timerElement.textContent =
      "🔒 আগে লগইন করুন";

    bonusStatus.textContent =
      "🔒 লগইন করলে রেফার কাউন্ট দেখা যাবে";

    return;
  }


  try {

    console.log("LOGIN UID:", user.uid);


    /* ================================
       USER DOCUMENT
    ================================= */

    const userRef =
      doc(db, "users", user.uid);

    const userSnap =
      await getDoc(userRef);


    if (!userSnap.exists()) {

      countElement.textContent = "0 / 4";

      timerElement.textContent =
        "❌ ইউজারের তথ্য পাওয়া যায়নি";

      bonusStatus.textContent =
        "❌ User data পাওয়া যায়নি";

      return;
    }


    const data =
      userSnap.data();


    console.log("USER DATA:", data);


    /* ================================
       REFERRAL COUNT
    ================================= */

    let count =
      Number(data.referralCount ?? 0);


    if (count < 0) count = 0;

    if (count > 4) count = 4;


    countElement.textContent =
      count + " / 4";


    /* ================================
       BONUS STATUS
    ================================= */

    if (count >= 4) {

      bonusStatus.textContent =
        "🎉 ৪টি রেফার পূর্ণ হয়েছে!";

    } else {

      const remaining =
        4 - count;

      bonusStatus.textContent =
        "⏳ আরও " +
        remaining +
        "টি রেফার পূর্ণ করুন";

    }


    /* ================================
       DAILY TIMER
    ================================= */

    const startedAt =
      data.dailyReferralStartedAt;


    if (!startedAt) {

      timerElement.textContent =
        "⏳ রেফার শুরু হলে ২৪ ঘণ্টার সময় শুরু হবে";

      return;
    }


    const startTime =
      startedAt.toMillis();

    const endTime =
      startTime + (24 * 60 * 60 * 1000);


    function updateTimer(){

      const now =
        Date.now();

      const remaining =
        endTime - now;


      if (remaining <= 0) {

        timerElement.textContent =
          "✅ ২৪ ঘণ্টার সময় শেষ";

        return;
      }


      const totalSeconds =
        Math.floor(remaining / 1000);


      const hours =
        Math.floor(totalSeconds / 3600);


      const minutes =
        Math.floor(
          (totalSeconds % 3600) / 60
        );


      const seconds =
        totalSeconds % 60;


      timerElement.textContent =
        "⏳ সময় বাকি: " +

        String(hours).padStart(2,"0") +

        ":" +

        String(minutes).padStart(2,"0") +

        ":" +

        String(seconds).padStart(2,"0");
    }


    updateTimer();

    setInterval(updateTimer,1000);


  } catch(error) {

    console.error(
      "Daily Bonus Error:",
      error
    );


    countElement.textContent =
      "0 / 4";


    timerElement.textContent =
      "❌ Data Load Error";


    bonusStatus.textContent =
      "❌ ডাটা লোড করা যায়নি";
  }

});

</script>

</body>
</html>
