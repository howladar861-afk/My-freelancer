<!-- FIREBASE + DAILY REFERRAL STATUS -->
<!-- ===================================== -->

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


    import {
        getFirestore
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    import {
        getAuth,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
  getDailyReferralStatus
} from "./dailyReferral.js";
alert("SCRIPT LOADED");
    /* =====================================
       FIREBASE CONFIG
    ===================================== */

    const firebaseConfig = {

        apiKey: "AIzaSyBFUKPT7fo6sUofdO09ffiZgjdlaR5evm8",

        authDomain:
            "rakib-freelancer-9c66b.firebaseapp.com",

        projectId:
            "rakib-freelancer-9c66b",

        storageBucket:
            "rakib-freelancer-9c66b.firebasestorage.app",

        messagingSenderId:
            "541209844482",

        appId:
            "1:541209844482:web:510568d5226c9bf47ac01b",

        measurementId:
            "G-F6QNE0QN5K"
    };


    /* =====================================
       FIREBASE START
    ===================================== */

    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);

    const db =
        getFirestore(app);


    /* =====================================
       DAILY REFERRAL COUNT
    ===================================== */

    onAuthStateChanged(auth, async (user) => {

        if (!user) {

            console.log(
                "User is not logged in."
            );

            return;
        }
console.log("LOGIN UID:", user.uid);

        try {

            const status =
  await getDailyReferralStatus(
    db,
    user.uid
  );
console.log("DAILY STATUS:", status);
alert("Daily Count = " + status.count);
            /* ===============================
               REFERRAL COUNT
            =============================== */

            const countElement =
                document.getElementById(
                    "dailyReferralCount"
                );


            if (countElement) {

                countElement.textContent =
                    status.count ?? 0;

            }


            /* ===============================
               BONUS STATUS
            =============================== */

            const bonusStatus =
                document.getElementById(
                    "bonusStatus"
                );


            if (bonusStatus) {

                if (status.completed) {

                    bonusStatus.textContent =
                        "🎉 ৪টি রেফার সম্পূর্ণ হয়েছে!";

                } else {

                    const remaining =
                        Math.max(
                            0,
                            (status.limit ?? 4) -
                            (status.count ?? 0)
                        );


                    bonusStatus.textContent =
                        `⏳ আরও ${remaining}টি রেফার পূরণ করুন`;

                }

            }


            console.log(
                "Daily Referral Status:",
                status
            );


        } catch (error) {

            console.error(
                "Daily Referral Load Error:",
                error
            );


            const bonusStatus =
                document.getElementById(
                    "bonusStatus"
                );


            if (bonusStatus) {

                bonusStatus.textContent =
                    "❌ তথ্য লোড করা যায়নি";

            }

        }

    });

</script>
