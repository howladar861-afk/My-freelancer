<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>রবি অফার - রাকিব ফ্রিল্যান্সার</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#ffffff;
    color:#222;
}

/* HEADER */
.header{
    background:#d4148e;
    color:white;
    text-align:center;
    padding:18px 10px 20px;
}

.header h1{
    margin:0;
    font-size:30px;
    font-weight:800;
}

.header p{
    margin:10px 0 0;
    font-size:22px;
    font-weight:bold;
}

/* SEARCH */
.search-box{
    margin:25px auto;
    width:90%;
    max-width:620px;
    height:90px;
    background:white;
    border-radius:28px;
    box-shadow:0 4px 18px rgba(0,0,0,0.15);
    display:flex;
    align-items:center;
    padding:10px 20px;
}

.logo{
    width:65px;
    height:65px;
    border-radius:12px;
    background:#e52b35;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
    font-weight:bold;
}

.search-text{
    flex:1;
    font-size:48px;
    color:#777;
    padding-left:20px;
}

.search-icon{
    font-size:48px;
    color:#d4148e;
}

/* CATEGORY */
.category{
    background:#d4148e;
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:16px 5px;
    color:white;
    font-size:18px;
    font-weight:bold;
    overflow:hidden;
}

.category div{
    padding:10px 8px;
    white-space:nowrap;
}

.category .active{
    color:#fff200;
    border-bottom:7px solid #fff200;
}

/* EMPTY OFFER AREA */
.empty-area{
    min-height:650px;
    text-align:center;
    padding:120px 25px 50px;
}

.gift{
    font-size:110px;
    opacity:.35;
}

.empty-title{
    margin-top:40px;
    color:#d4148e;
    font-size:30px;
    font-weight:800;
    line-height:1.5;
}

.empty-text{
    margin-top:35px;
    color:#777;
    font-size:22px;
    line-height:1.8;
}

/* MOBILE */
@media(max-width:500px){

    .header h1{
        font-size:29px;
    }

    .header p{
        font-size:21px;
    }

    .search-box{
        height:88px;
    }

    .logo{
        width:60px;
        height:60px;
        font-size:42px;
    }

    .search-text{
        font-size:42px;
    }

    .search-icon{
        font-size:40px;
    }

    .category{
        font-size:17px;
    }

    .empty-title{
        font-size:27px;
    }

    .empty-text{
        font-size:21px;
    }

}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

    <h1>রবি অফার</h1>

    <p>রাকিব ফ্রিল্যান্সার</p>

</div>


<!-- SEARCH -->

<div class="search-box">

    <div class="logo">R</div>

    <div class="search-text">
        Search
    </div>

    <div class="search-icon">
        🔍
    </div>

</div>


<!-- CATEGORY -->

<div class="category">

    <div class="active">All</div>

    <div>Minutes</div>

    <div>Internet</div>

    <div>Bundles</div>

    <div>Call Rate</div>

</div>


<!-- EMPTY OFFER -->

<div class="empty-area">

    <div class="gift">
        🎁
    </div>

    <div class="empty-title">
        রবির অফারগুলো শীঘ্রই<br>
        যোগ করা হবে
    </div>

    <div class="empty-text">
        আমরা আপনার জন্য সেরা অফার নিয়ে আসছি।<br>
        অনুগ্রহ করে কিছুক্ষণ অপেক্ষা করুন।
    </div>

</div>

</body>
  </html>
