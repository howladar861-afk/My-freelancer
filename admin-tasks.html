<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Tasks</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #222;
    }

    .header {
      background: #2563eb;
      color: white;
      padding: 18px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }

    .container {
      width: 94%;
      max-width: 700px;
      margin: 20px auto 50px;
    }

    .status {
      background: white;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 15px;
      text-align: center;
      font-weight: bold;
    }

    .task {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 5px 15px rgba(0,0,0,.15);
    }

    .task h3 {
      margin-top: 0;
      color: #2563eb;
    }

    .info {
      margin: 8px 0;
      line-height: 1.5;
    }

    .reward {
      font-size: 22px;
      font-weight: bold;
      color: #16a34a;
      margin: 12px 0;
    }

    .screenshot {
      width: 100%;
      max-height: 500px;
      object-fit: contain;
      border-radius: 12px;
      margin-top: 10px;
      border: 1px solid #ddd;
      background: #eee;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 16px;
      font-weight: bold;
      color: white;
    }

    .approve {
      background: #16a34a;
    }

    .reject {
      background: #dc2626;
    }

    .empty {
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="header">
    🛠️ Admin Task Panel
  </div>

  <div class="container">

    <div id="adminStatus" class="status">
      কাজগুলো লোড হচ্ছে...
    </div>

    <div id="taskList"></div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    import {
      getFirestore,
      collection,
      query,
      where,
      getDocs,
      doc,
      runTransaction
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    // =====================================
    // FIREBASE CONFIG
    // =====================================

    const firebaseConfig = {

      apiKey: "AIzaSyBFUKPT7fo6sUofdO09ffiZgjdlaR5evm8",

      authDomain:
        "rakib-freelancer-9c66b.firebaseapp.com",

      projectId:
        "rakib-freelancer-9c66b",

      storageBucket:
        "rakib-freelancer-9c66b.firebasestorage.app",

      messagingSenderId:
        "541209844482",

      appId:
        "1:541209844482:web:510568d5226c9bf47ac01b"

    };


    // =====================================
    // ADMIN EMAIL
    // =====================================

    const ADMIN_EMAIL =
      "howladar861@gmail.com";


    // =====================================
    // FIREBASE INIT
    // =====================================

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    // =====================================
    // ELEMENTS
    // =====================================

    const taskList =
      document.getElementById("taskList");

    const adminStatus =
      document.getElementById("adminStatus");


    // =====================================
    // CHECK ADMIN
    // =====================================

    onAuthStateChanged(auth, async (user) => {

      if (!user) {

        adminStatus.textContent =
          "⚠️ আগে Admin Login করুন";

        window.location.href =
          "index.html";

        return;
      }


      if (
        user.email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
      ) {

        adminStatus.textContent =
          "❌ আপনার Admin Access নেই";

        return;
      }


      adminStatus.textContent =
        "✅ Admin Login সফল";


      await loadTasks();

    });


    // =====================================
    // LOAD PENDING TASKS
    // =====================================

    async function loadTasks() {

      try {

        taskList.innerHTML = "";


        const tasksQuery = query(
          collection(db, "taskSubmissions"),
          where("status", "==", "pending")
        );


        const snapshot =
          await getDocs(tasksQuery);


        if (snapshot.empty) {

          taskList.innerHTML = `
            <div class="empty">
              ✅ এখন কোনো Pending Task নেই।
            </div>
          `;

          return;
        }


        snapshot.forEach((taskDoc) => {

          const data =
            taskDoc.data();

          const taskId =
            taskDoc.id;


          const taskTitle =
            data.taskTitle ||
            "Task";


          const userEmail =
            data.email ||
            "Email নেই";


          const userId =
            data.userId ||
            "";


          const reward =
            Number(data.reward || 0);


          const screenshotUrl =
            data.screenshotUrl ||
            "";


          const task = document.createElement("div");

          task.className = "task";


          task.innerHTML = `

            <h3>
              📌 ${escapeHtml(taskTitle)}
            </h3>

            <div class="info">
              <b>User Email:</b>
              ${escapeHtml(userEmail)}
            </div>

            <div class="info">
              <b>User ID:</b>
              ${escapeHtml(userId)}
            </div>

            <div class="reward">
              💰 Reward: ৳${reward.toFixed(2)}
            </div>

            ${
              screenshotUrl
              ? `
                <div class="info">
                  <b>Payment/Task Screenshot:</b>
                </div>

                <img
                  class="screenshot"
                  src="${escapeHtml(screenshotUrl)}"
                  alt="Task Screenshot"
                >
              `
              : `
                <div class="info">
                  ⚠️ Screenshot পাওয়া যায়নি
                </div>
              `
            }

            <div class="buttons">

              <button
                class="approve"
                data-id="${taskId}"
              >
                ✅ Approve
              </button>

              <button
                class="reject"
                data-id="${taskId}"
              >
                ❌ Reject
              </button>

            </div>
          `;


          taskList.appendChild(task);


          task
            .querySelector(".approve")
            .addEventListener(
              "click",
              () => approveTask(
                taskId,
                userId,
                reward
              )
            );


          task
            .querySelector(".reject")
            .addEventListener(
              "click",
              () => rejectTask(taskId)
            );

        });


      } catch (error) {

        console.error(
          "Load Tasks Error:",
          error
        );

        adminStatus.textContent =
          "❌ Task load করা যায়নি: " +
          error.message;

      }

    }


    // =====================================
    // APPROVE TASK
    // =====================================

    async function approveTask(
      taskId,
      userId,
      reward
    ) {

      if (!userId) {

        alert("❌ User ID পাওয়া যায়নি");

        return;
      }


      if (reward <= 0) {

        alert("❌ Reward সঠিক নয়");

        return;
      }


      const confirmApprove =
        confirm(
          "এই Task Approve করলে User-এর Balance-এ ৳" +
          reward.toFixed(2) +
          " যোগ হবে।\n\nApprove করবেন?"
        );


      if (!confirmApprove) {
        return;
      }


      try {

        await runTransaction(
          db,
          async (transaction) => {

            const taskRef =
              doc(
                db,
                "taskSubmissions",
                taskId
              );


            const userRef =
              doc(
                db,
                "users",
                userId
              );


            const taskSnap =
              await transaction.get(taskRef);


            const userSnap =
              await transaction.get(userRef);


            if (!taskSnap.exists()) {

              throw new Error(
                "Task পাওয়া যায়নি"
              );

            }


            if (!userSnap.exists()) {

              throw new Error(
                "User পাওয়া যায়নি"
              );

            }


            const taskData =
              taskSnap.data();


            if (
              taskData.status !==
              "pending"
            ) {

              throw new Error(
                "এই Task ইতিমধ্যে Process করা হয়েছে"
              );

            }


            const userData =
              userSnap.data();


            const oldBalance =
              Number(
                userData.balance || 0
              );


            const newBalance =
              oldBalance + reward;


            transaction.update(
              taskRef,
              {

                status: "approved",

                approvedAt:
                  new Date(),

                approvedReward:
                  reward

              }
            );


            transaction.update(
              userRef,
              {

                balance:
                  newBalance

              }
            );

          }
        );


        alert(
          "✅ Task Approved!\nUser Balance-এ ৳" +
          reward.toFixed(2) +
          " যোগ হয়েছে।"
        );


        await loadTasks();


      } catch (error) {

        console.error(
          "Approve Error:",
          error
        );


        alert(
          "❌ Approve করা যায়নি:\n" +
          error.message
        );

      }

    }


    // =====================================
    // REJECT TASK
    // =====================================

    async function rejectTask(taskId) {

      const confirmReject =
        confirm(
          "এই Task Reject করবেন?\n\nReject করলে User কোনো টাকা পাবে না।"
        );


      if (!confirmReject) {
        return;
      }


      try {

        await runTransaction(
          db,
          async (transaction) => {

            const taskRef =
              doc(
                db,
                "taskSubmissions",
                taskId
              );


            const taskSnap =
              await transaction.get(
                taskRef
              );


            if (!taskSnap.exists()) {

              throw new Error(
                "Task পাওয়া যায়নি"
              );

            }


            const taskData =
              taskSnap.data();


            if (
              taskData.status !==
              "pending"
            ) {

              throw new Error(
                "এই Task ইতিমধ্যে Process করা হয়েছে"
              );

            }


            transaction.update(
              taskRef,
              {

                status: "rejected",

                rejectedAt:
                  new Date(),

                approvedReward:
                  0

              }
            );

          }
        );


        alert(
          "❌ Task Reject করা হয়েছে। User কোনো টাকা পাবে না।"
        );


        await loadTasks();


      } catch (error) {

        console.error(
          "Reject Error:",
          error
        );


        alert(
          "❌ Reject করা যায়নি:\n" +
          error.message
        );

      }

    }


    // =====================================
    // HTML SECURITY
    // =====================================

    function escapeHtml(value) {

      return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

    }

  </script>

</body>
  </html>
