<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rakib Freelancer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="auth">

<h2>Create Account</h2>

<input type="text" id="name" placeholder="Full Name">

<input type="email" id="email" placeholder="Email Address">

<input type="password" id="password" placeholder="Password">

<input type="text" id="referral" placeholder="Referral Code (Optional)">

<button id="registerBtn">Register</button>

<hr>

<h2>Login</h2>

<input type="email" id="loginEmail" placeholder="Email">

<input type="password" id="loginPassword" placeholder="Password">

<button id="loginBtn">Login</button>

</section>
<footer>
<p>© 2026 Rakib Freelancer. All Rights Reserved.</p>
</footer>
<script type="module" src="script.js"></script>
  <!-- Rakib Freelancer Custom Popup -->
<div id="customPopup" style="
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    z-index:99999;
    align-items:center;
    justify-content:center;
">
    <div style="
        width:85%;
        max-width:400px;
        background:white;
        border-radius:20px;
        padding:25px;
        text-align:center;
        box-shadow:0 10px 40px rgba(0,0,0,0.4);
    ">
        <h2 style="
            color:#08a879;
            margin:0 0 20px;
        ">
            Rakib Freelancer
        </h2>

        <p id="popupMessage" style="
            color:#222;
            font-size:18px;
            margin-bottom:25px;
        "></p>

        <button onclick="closeCustomPopup()" style="
            border:0;
            background:none;
            color:#1769e0;
            font-size:17px;
            font-weight:bold;
            padding:10px 20px;
        ">
            OK
        </button>
    </div>
</div>

<script>
function showCustomPopup(message) {
    document.getElementById("popupMessage").textContent = message;
    document.getElementById("customPopup").style.display = "flex";
}

function closeCustomPopup() {
    document.getElementById("customPopup").style.display = "none";
}
</script>
</body>
</html>
