<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rakib Freelancer - Admin</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0d1628;
  color:white;
}

.container{
  max-width:420px;
  margin:80px auto;
  padding:25px;
}

.card{
  background:#222;
  padding:25px;
  border-radius:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.4);
}

h1{
  text-align:center;
  color:#ffc107;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin:10px 0;
  border:0;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#ffc107;
  font-size:17px;
  font-weight:bold;
}

#adminPanel{
  display:none;
}

#message{
  text-align:center;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

  <!-- Admin Login -->
  <div class="card" id="loginBox">
    <h1>🔐 Admin Login</h1>

    <input
      type="email"
      id="adminEmail"
      placeholder="Admin Email"
    >

    <input
      type="password"
      id="adminPassword"
      placeholder="Password"
    >

    <button id="adminLoginBtn">
      Login
    </button>

    <p id="message"></p>
  </div>


  <!-- Admin Panel -->
  <div class="card" id="adminPanel">

    <h1>👑 Admin Panel</h1>

    <p>
      Admin সফলভাবে Login করেছেন।
    </p>

    <button id="logoutBtn">
      Logout
    </button>

  </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyBFUKPT7fo6sUofdO09ffiZgjdlaR5evm8",
  authDomain: "rakib-freelancer-9c66b.firebaseapp.com",
  projectId: "rakib-freelancer-9c66b",
  storageBucket: "rakib-freelancer-9c66b.firebasestorage.app",
  messagingSenderId: "541209844482",
  appId: "1:541209844482:web:510568d5226c9bf47ac01b",
  measurementId: "G-F6QNE0QN5K"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);


const loginBtn =
document.getElementById("adminLoginBtn");

const message =
document.getElementById("message");

const loginBox =
document.getElementById("loginBox");

const adminPanel =
document.getElementById("adminPanel");

const logoutBtn =
document.getElementById("logoutBtn");


loginBtn.onclick = async () => {

  const email =
    document.getElementById("adminEmail").value.trim();

  const password =
    document.getElementById("adminPassword").value;


  if (!email || !password) {

    message.textContent =
      "Email ও Password দিন।";

    return;
  }


  try {

    const result =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    const uid =
      result.user.uid;


    // admins collection থেকে Admin যাচাই
    const adminDoc =
      await getDoc(
        doc(db, "admins", uid)
      );


    if (!adminDoc.exists()) {

      await signOut(auth);

      message.textContent =
        "❌ আপনি Admin নন।";

      return;
    }


    if (adminDoc.data().role !== "admin") {

      await signOut(auth);

      message.textContent =
        "❌ Admin permission নেই।";

      return;
    }


    // সফল Admin Login
    loginBox.style.display = "none";
    adminPanel.style.display = "block";

  }

  catch(error) {

    message.textContent =
      "❌ " + error.message;

  }

};


logoutBtn.onclick = async () => {

  await signOut(auth);

  adminPanel.style.display = "none";
  loginBox.style.display = "block";

};

</script>

</body>
</html>
