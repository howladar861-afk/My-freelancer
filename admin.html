<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rakib Freelancer - Admin</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0d1628;
  color:white;
}

.container{
  max-width:600px;
  margin:40px auto;
  padding:20px;
}

.card{
  background:#222;
  padding:20px;
  border-radius:18px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.4);
}

h1{
  text-align:center;
  color:#ffc107;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin:10px 0;
  border:0;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.login-btn{
  background:#ffc107;
}

.logout-btn{
  background:#dc3545;
  color:white;
}

.request{
  background:#f5f5f5;
  color:#222;
  padding:18px;
  border-radius:14px;
  margin-top:15px;
}

.request h3{
  margin-top:0;
  color:#2563eb;
}

.status{
  font-weight:bold;
  margin:10px 0;
}

.approve{
  background:#16a34a;
  color:white;
}

.reject{
  background:#dc2626;
  color:white;
}

.delete{
  background:#555;
  color:white;
}

#adminPanel{
  display:none;
}

#message{
  text-align:center;
  margin-top:15px;
}

#requestList{
  margin-top:20px;
}

.empty{
  text-align:center;
  color:#aaa;
  padding:20px;
}
</style>
</head>

<body>

<div class="container">

  <!-- Admin Login -->
  <div class="card" id="loginBox">

    <h1>🔐 Admin Login</h1>

    <input
      type="email"
      id="adminEmail"
      placeholder="Admin Email"
    >

    <input
      type="password"
      id="adminPassword"
      placeholder="Password"
    >

    <button
      class="login-btn"
      id="adminLoginBtn">
      Login
    </button>

    <p id="message"></p>

  </div>


  <!-- Admin Panel -->
  <div class="card" id="adminPanel">

    <h1>👑 Admin Panel</h1>

    <p>
      Verification Requests
    </p>

    <button
      class="logout-btn"
      id="logoutBtn">
      Logout
    </button>

    <div id="requestList">
      <p class="empty">
        Request Loading...
      </p>
    </div>

  </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  collection,
  onSnapshot,
  updateDoc,
  deleteDoc,
  query,
  orderBy
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyBFUKPT7fo6sUofdO09ffiZgjdlaR5evm8",
  authDomain: "rakib-freelancer-9c66b.firebaseapp.com",
  projectId: "rakib-freelancer-9c66b",
  storageBucket: "rakib-freelancer-9c66b.firebasestorage.app",
  messagingSenderId: "541209844482",
  appId: "1:541209844482:web:510568d5226c9bf47ac01b",
  measurementId: "G-F6QNE0QN5K"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);


const loginBtn =
document.getElementById("adminLoginBtn");

const message =
document.getElementById("message");

const loginBox =
document.getElementById("loginBox");

const adminPanel =
document.getElementById("adminPanel");

const logoutBtn =
document.getElementById("logoutBtn");

const requestList =
document.getElementById("requestList");


let unsubscribeRequests = null;


/* =========================
   ADMIN LOGIN
========================= */

loginBtn.onclick = async () => {

  const email =
    document.getElementById("adminEmail").value.trim();

  const password =
    document.getElementById("adminPassword").value;


  if (!email || !password) {

    message.textContent =
      "Email ও Password দিন।";

    return;
  }


  try {

    const result =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    const uid =
      result.user.uid;


    const adminDoc =
      await getDoc(
        doc(db, "admins", uid)
      );


    if (!adminDoc.exists()) {

      await signOut(auth);

      message.textContent =
        "❌ আপনি Admin নন।";

      return;
    }


    if (adminDoc.data().role !== "admin") {

      await signOut(auth);

      message.textContent =
        "❌ Admin permission নেই।";

      return;
    }


    loginBox.style.display = "none";

    adminPanel.style.display = "block";


    loadRequests();

  }

  catch(error) {

    message.textContent =
      "❌ " + error.message;

  }

};


/* =========================
   LOAD VERIFICATION REQUESTS
========================= */

function loadRequests(){

  const requestsRef =
    collection(db, "verificationRequests");


  const requestsQuery =
    query(
      requestsRef,
      orderBy("createdAt", "desc")
    );


  unsubscribeRequests =
    onSnapshot(
      requestsQuery,
      (snapshot) => {

        requestList.innerHTML = "";


        if (snapshot.empty) {

          requestList.innerHTML =
            '<p class="empty">কোনো Verification Request নেই।</p>';

          return;
        }


        snapshot.forEach((requestDoc) => {

          const data =
            requestDoc.data();

          const id =
            requestDoc.id;


          const request =
            document.createElement("div");

          request.className =
            "request";


          request.innerHTML = `

            <h3>🧾 Verification Request</h3>

            <p>
              <b>Payment Method:</b>
              ${data.paymentMethod || "N/A"}
            </p>

            <p>
              <b>Sender Number:</b>
              ${data.senderNumber || "N/A"}
            </p>

            <p>
              <b>Transaction ID:</b>
              ${data.transactionId || "N/A"}
            </p>

            <p>
              <b>User ID:</b>
              ${data.userId || "N/A"}
            </p>

            <p class="status">
              Status:
              ${data.status || "pending"}
            </p>

            <button
              class="approve"
              data-id="${id}">
              ✅ Approve
            </button>

            <button
              class="reject"
              data-id="${id}">
              ❌ Reject
            </button>

            <button
              class="delete"
              data-id="${id}">
              🗑️ Delete
            </button>

          `;


          /* APPROVE */

          request
          .querySelector(".approve")
          .onclick = async () => {

            try {

              await updateDoc(
                doc(
                  db,
                  "verificationRequests",
                  id
                ),
                {
                  status: "approved"
                }
              );

              alert("✅ Request Approved");

            }

            catch(error){

              alert(
                "❌ Error: " +
                error.message
              );

            }

          };


          /* REJECT */

          request
          .querySelector(".reject")
          .onclick = async () => {

            try {

              await updateDoc(
                doc(
                  db,
                  "verificationRequests",
                  id
                ),
                {
                  status: "rejected"
                }
              );

              alert("❌ Request Rejected");

            }

            catch(error){

              alert(
                "❌ Error: " +
                error.message
              );

            }

          };


          /* DELETE */

          request
          .querySelector(".delete")
          .onclick = async () => {

            const confirmDelete =
              confirm(
                "এই Request টি Delete করবেন?"
              );


            if (!confirmDelete){
              return;
            }


            try {

              await deleteDoc(
                doc(
                  db,
                  "verificationRequests",
                  id
                )
              );

              alert("🗑️ Request Deleted");

            }

            catch(error){

              alert(
                "❌ Error: " +
                error.message
              );

            }

          };


          requestList.appendChild(request);

        });

      },

      (error) => {

        requestList.innerHTML =
          "<p class='empty'>❌ Request Load করা যায়নি: " +
          error.message +
          "</p>";

      }

    );

}


/* =========================
   LOGOUT
========================= */

logoutBtn.onclick = async () => {

  if (unsubscribeRequests) {
    unsubscribeRequests();
    unsubscribeRequests = null;
  }


  await signOut(auth);


  adminPanel.style.display =
    "none";

  loginBox.style.display =
    "block";

};

</script>

</body>
</html>
