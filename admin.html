<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rakib Freelancer - Admin</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0d1628;
  color:white;
}

.container{
  max-width:600px;
  margin:40px auto;
  padding:20px;
}

.card{
  background:#222;
  padding:20px;
  border-radius:18px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.4);
}

h1{
  text-align:center;
  color:#ffc107;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin:10px 0;
  border:0;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.login-btn{
  background:#ffc107;
}

.logout-btn{
  background:#dc3545;
  color:white;
}

.request{
  background:#f5f5f5;
  color:#222;
  padding:18px;
  border-radius:14px;
  margin-top:15px;
}

.request h3{
  margin-top:0;
  color:#2563eb;
}

.status{
  font-weight:bold;
  margin:10px 0;
}

.approve{
  background:#16a34a;
  color:white;
}

.reject{
  background:#dc2626;
  color:white;
}

.delete{
  background:#555;
  color:white;
}

#adminPanel{
  display:none;
}

#message{
  text-align:center;
  margin-top:15px;
}

#requestList{
  margin-top:20px;
}

.empty{
  text-align:center;
  color:#aaa;
  padding:20px;
}
</style>
</head>

<body>

<div class="container">

  <!-- Admin Login -->
  <div class="card" id="loginBox">

    <h1>🔐 Admin Login</h1>

    <input
      type="email"
      id="adminEmail"
      placeholder="Admin Email"
    >

    <input
      type="password"
      id="adminPassword"
      placeholder="Password"
    >

    <button
      class="login-btn"
      id="adminLoginBtn">
      Login
    </button>

    <p id="message"></p>

  </div>


  <!-- Admin Panel -->
  <div class="card" id="adminPanel">

    <h1>👑 Admin Panel</h1>
<div class="card" style="background:#111827; text-align:center;">
  <h2 style="color:#ffc107; margin-bottom:10px;">
    💰 Company Wallet
  </h2>

  <div
    id="companyWallet"
    style="font-size:28px; font-weight:bold; color:#22c55e;">
    Loading...
  </div>
</div>
    <p>
      Verification Requests
    </p>

    <button
      class="logout-btn"
      id="logoutBtn">
      Logout
    </button>

    <div id="requestList">
      <p class="empty">
        Request Loading...
      </p>
    </div>

  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  where,
  onSnapshot,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  deleteDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyBFUKPT7fo6sUofdO09ffiZgjdlaR5evm8",
  authDomain: "rakib-freelancer-9c66b.firebaseapp.com",
  projectId: "rakib-freelancer-9c66b",
  storageBucket: "rakib-freelancer-9c66b.firebasestorage.app",
  messagingSenderId: "541209844482",
  appId: "1:541209844482:web:510568d5226c9bf47ac01b"
};


const ADMIN_UID =
  "MwiyoLqCJeYERHAwUKAa17sLwop1";


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


const loginBtn =
  document.getElementById("adminLoginBtn");

const message =
  document.getElementById("message");

const loginBox =
  document.getElementById("loginBox");

const adminPanel =
  document.getElementById("adminPanel");

const logoutBtn =
  document.getElementById("logoutBtn");

const requestList =
  document.getElementById("requestList");


/* =========================
   ADMIN LOGIN
========================= */

loginBtn.onclick = async function () {

  const email =
    document.getElementById("adminEmail").value.trim();

  const password =
    document.getElementById("adminPassword").value;


  if (!email || !password) {

    message.textContent =
      "Email ও Password দিন।";

    return;
  }


  try {

    const result =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    if (result.user.uid !== ADMIN_UID) {

      await signOut(auth);

      message.textContent =
        "❌ আপনি Admin নন।";

      return;
    }


    loginBox.style.display =
      "none";

    adminPanel.style.display =
      "block";

    message.textContent = "";


    loadVerificationRequests();
loadCompanyWallet();
  }

  catch (error) {

    console.error(error);

    message.textContent =
      "❌ Login করা যায়নি: " +
      error.message;

  }

};


/* =========================
   LOAD PENDING REQUESTS
========================= */

function loadVerificationRequests() {

  const requestsRef =
    collection(
      db,
      "verificationRequests"
    );


  const requestsQuery =
    query(
      requestsRef,
      where(
        "verificationStatus",
        "==",
        "pending"
      )
    );


  onSnapshot(

    requestsQuery,

    function (snapshot) {

      requestList.innerHTML = "";


      if (snapshot.empty) {

        requestList.innerHTML =
          '<p class="empty">কোনো Pending Verification নেই।</p>';

        return;
      }


      snapshot.forEach(function (requestDoc) {

        const data =
          requestDoc.data();

        const id =
          requestDoc.id;


        const request =
          document.createElement("div");

        request.className =
          "request";


        request.innerHTML = `

          <h3>🧾 Verification Request</h3>

          <p>
            <b>Name:</b>
            ${data.name || "নেই"}
          </p>

          <p>
            <b>Email:</b>
            ${data.email || "নেই"}
          </p>

          <p>
            <b>Payment Number:</b>
            ${data.verificationPaymentNumber || "নেই"}
          </p>

          <p>
            <b>Transaction ID:</b>
            ${data.verificationTransactionId || "নেই"}
          </p>

          <p>
            <b>User ID:</b>
            ${data.userId || "নেই"}
          </p>

          <p class="status">
            Status:
            ${data.verificationStatus || "pending"}
          </p>

          <button
            class="approve">
            ✅ Approve
          </button>

          <button
            class="reject">
            ❌ Reject
          </button>

          <button
            class="delete">
            🗑️ Delete
          </button>

        `;


        requestList.appendChild(request);


        /* APPROVE */

        request
          .querySelector(".approve")
          .onclick = function () {

            approveRequest(id);

          };


        /* REJECT */

        request
          .querySelector(".reject")
          .onclick = function () {

            rejectRequest(id);

          };


        /* DELETE */

        request
          .querySelector(".delete")
          .onclick = function () {

            deleteRequest(id);

          };

      });

    },

    function (error) {

      console.error(
        "Request Load Error:",
        error
      );

      requestList.innerHTML =
        `<p class="empty">
          ❌ Request Load করা যায়নি:<br><br>
          ${error.message}
        </p>`;

    }

  );

}

/* =========================
   LOAD COMPANY WALLET
========================= */

async function loadCompanyWallet() {

  const walletElement =
    document.getElementById("companyWallet");

  try {

    const walletRef =
  doc(
    db,
    "company",
    "wallet"
  );

    const walletSnap =
      await getDoc(walletRef);

    if (walletSnap.exists()) {

      const data =
        walletSnap.data();

      const balance =
        data.balance || 0;

      walletElement.textContent =
        "৳ " +
        Number(balance).toLocaleString("en-BD");

    } else {

      walletElement.textContent =
        "৳ 0";

    }

  } catch (error) {

    console.error(
      "Company Wallet Load Error:",
      error
    );

    walletElement.textContent =
      "৳ 0";
  }
}
/* =========================
   APPROVE
========================= */

/* =========================
   APPROVE + REFERRAL COMMISSION
========================= */

async function approveRequest(id) {

  if (
    !confirm(
      "এই Verification Approve করবেন?\n\nLevel 1 = ৳30\nLevel 2 = ৳10"
    )
  ) {
    return;
  }

  try {

    // =================================
    // PROCESS VERIFICATION + COMMISSION
    // =================================

    const result =
      await processReferralCommission(
        db,
        id
      );


    // =================================
    // REFRESH COMPANY WALLET
    // =================================

    await loadCompanyWallet();


    // =================================
    // SUCCESS
    // =================================

    alert(
      "✅ Verification Approved!\n\n" +
      "Level 1 Commission: ৳" +
      result.level1 +
      "\n" +
      "Level 2 Commission: ৳" +
      result.level2 +
      "\n\n" +
      "Company Wallet থেকে মোট ৳" +
      (
        Number(result.level1 || 0) +
        Number(result.level2 || 0)
      ) +
      " কাটা হয়েছে।"
    );

  }

  catch (error) {

    console.error(
      "Approve + Commission Error:",
      error
    );


    alert(
      "❌ Verification/Commission করা যায়নি:\n\n" +
      error.message
    );

  }

}
/* =========================
   REJECT
========================= */

async function rejectRequest(id) {

  if (
    !confirm(
      "এই Verification Reject করবেন?"
    )
  ) {
    return;
  }


  try {

    await updateDoc(
      doc(
        db,
        "verificationRequests",
        id
      ),
      {

        verificationStatus:
          "rejected",

        verified:
          false,

        rejectedAt:
          serverTimestamp()

      }
    );


    alert(
      "❌ Verification Rejected!"
    );

  }

  catch (error) {

    alert(
      "❌ Reject করা যায়নি:\n\n" +
      error.message
    );

  }

}


/* =========================
   DELETE
========================= */

async function deleteRequest(id) {

  if (
    !confirm(
      "এই Request Delete করবেন?"
    )
  ) {
    return;
  }


  try {

    await deleteDoc(
      doc(
        db,
        "verificationRequests",
        id
      )
    );


    alert(
      "🗑️ Request Deleted!"
    );

  }

  catch (error) {

    alert(
      "❌ Delete করা যায়নি:\n\n" +
      error.message
    );

  }

}


/* =========================
   LOGOUT
========================= */

logoutBtn.onclick =
  async function () {

    try {

      await signOut(auth);

      adminPanel.style.display =
        "none";

      loginBox.style.display =
        "block";

      requestList.innerHTML =
        '<p class="empty">Request Loading...</p>';

    }

    catch (error) {

      alert(
        "❌ Logout করা যায়নি।"
      );

    }

  };

</script>
