    margin:0;
    padding:0;

body{

/* HEADER */
.header{
    background:#00a651;
    color:white;
    text-align:center;
    padding:22px 10px;
}

.header h1{
    font-size:30px;
    margin-bottom:8px;
}

.header p{
    font-size:20px;
}

/* SEARCH */
.search-box{
    background:white;
    margin:15px;
    padding:5px 15px;
    border-radius:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.12);
}

.search-box input{
    width:100%;
    border:0;
    outline:none;
    font-size:20px;
    padding:14px 5px;
}

/* CATEGORIES */
.categories{
    display:flex;
    overflow-x:auto;
    background:#00a651;
    padding:15px 10px;
    gap:30px;
    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.categories div{
    color:white;
    font-size:18px;
    white-space:nowrap;
    cursor:pointer;
    padding:3px 5px;
}

.categories .active{
    color:yellow;
    font-weight:bold;
}

/* OFFER */
.offer-area{
    padding:15px;
    min-height:400px;
}

.offer-card{
    background:white;
    border-radius:16px;
    margin-bottom:15px;
    padding:18px;
    box-shadow:0 3px 12px rgba(0,0,0,0.10);
    border:1px solid #e5e5e5;
}

.discount{
    display:inline-block;
    background:#8793ed;
    color:white;
    padding:7px 12px;
    border-radius:10px;
    font-size:14px;
    margin-bottom:10px;
}

.offer-title{
    font-size:21px;
    font-weight:bold;
    line-height:1.5;
    margin-bottom:8px;
}

.offer-info{
    color:#555;
    font-size:16px;
    line-height:1.6;
    margin-bottom:12px;
}

.offer-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.price-area{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.old-price{
    color:#f05a28;
    font-size:17px;
}

.buy-price{
    color:#168b35;
    font-size:22px;
    font-weight:bold;
}

.category-badge{
    display:inline-block;
    background:#8793ed;
    color:white;
    padding:5px 12px;
    border-radius:8px;
    font-size:14px;
    margin-top:5px;
}

.buy-btn{
    background:white;
    color:#168b35;
    border:2px solid #d7d7d7;
    border-radius:12px;
    padding:13px 18px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.buy-btn:hover{
    background:#00a651;
    color:white;
    border-color:#00a651;
}

.offer-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:15px;
    padding-top:10px;
    border-top:1px solid #eee;
}

.validity{
    background:#eeeeee;
    color:#c52ba3;
    border-radius:25px;
    padding:8px 14px;
    font-size:15px;
}

.star{
    font-size:25px;
}

/* NO RESULT */
.no-result{
    background:white;
    border-radius:15px;
    padding:50px 20px;
    text-align:center;
    color:#777;
    font-size:19px;
    display:none;

/* POPUP */

    inset:0;
    background:rgba(0,0,0,0.65);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;

.popup-overlay.show{

/* ================= VARIABLES ================= */

let currentCategory = "All";


/* ================= DISPLAY ================= */

function displayOffers(){

    const offerList =
        document.getElementById("offerList");

    const noResult =
        document.getElementById("noResult");

    const searchText =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    offerList.innerHTML = "";

    const filteredOffers = offers.filter(function(offer){

        const categoryMatch =
            currentCategory === "All" ||
            offer.category === currentCategory;

        const searchMatch =
            offer.title.toLowerCase().includes(searchText) ||
            offer.details.toLowerCase().includes(searchText) ||
            offer.validity.toLowerCase().includes(searchText) ||
            String(offer.buyPrice).includes(searchText);

        return categoryMatch && searchMatch;

    });


    if(filteredOffers.length === 0){

        noResult.style.display = "block";
        return;

    }


    noResult.style.display = "none";


    filteredOffers.forEach(function(offer){

        const originalIndex =
            offers.indexOf(offer);

        const card =
            document.createElement("div");

        card.className = "offer-card";


        card.innerHTML = `

            <div class="discount">
                discount: ৳${offer.discount}
            </div>

            <div class="offer-title">
                ${offer.title}
            </div>

            <div class="offer-info">
                ➡️ ${offer.details}
                <br>
                ➡️ সারা বাংলাদেশ পাবে ★
            </div>

            <div class="offer-bottom">

                <div class="price-area">

                    <span class="old-price">
                        price: ৳${offer.price}
                    </span>

                    <span class="buy-price">
                        Buy ৳${offer.buyPrice}
                    </span>

                    <span class="category-badge">
                        ${offer.category}
                    </span>

                </div>

                <button
                    class="buy-btn"
                    onclick="openPopup(${originalIndex})">
                    Buy Now
                </button>

            </div>

            <div class="offer-footer">

                <span class="validity">
                    ⏱ ${offer.validity}
                </span>

                <span class="star">
                    ⭐
                </span>

            </div>
        `;


        offerList.appendChild(card);

    });

}


/* ================= CATEGORY ================= */

function filterCategory(category,element){

    currentCategory = category;


    document
    .querySelectorAll(".categories div")
    .forEach(function(item){

        item.classList.remove("active");

    });


    element.classList.add("active");


    displayOffers();

}


/* ================= SEARCH ================= */

function searchOffers(){

    displayOffers();

}


/* ================= OPEN POPUP ================= */

function openPopup(index){

    const offer = offers[index];


    document.getElementById("popupOffer")
        .textContent = offer.title;


    document.getElementById("popupPrice")
        .textContent = "৳" + offer.buyPrice;


    document.getElementById("popupValidity")
        .textContent = offer.validity;


    const message =
`আসসালামু আলাইকুম,

আমি এই অফারটি নিতে চাই।

অফার: ${offer.title}
মূল্য: ৳${offer.buyPrice}
মেয়াদ: ${offer.validity}

দয়া করে অফারটি অ্যাক্টিভ করে দিন।

ধন্যবাদ।
Rakib Freelancer`;


    document.getElementById("popupMessage")
        .value = message;


    const encodedMessage =
        encodeURIComponent(message);


    const whatsappURL =
    "https://wa.me/8801837976455" +
    "?text=" +
    encodedMessage;


    document.getElementById("whatsappButton")
        .href = whatsappURL;


    document
        .getElementById("popupOverlay")
        .classList.add("show");

}


/* ================= CLOSE POPUP ================= */

function closePopup(){

    document
        .getElementById("popupOverlay")
        .classList.remove("show");

}


/* ================= CLOSE OUTSIDE ================= */

function closePopupOutside(event){

    if(
        event.target ===
        document.getElementById("popupOverlay")
    ){

        closePopup();

    }

}


/* ================= ESC ================= */

document.addEventListener("keydown",function(event){

    if(event.key === "Escape"){

        closePopup();

    }

});
