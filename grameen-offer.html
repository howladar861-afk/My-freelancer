<script>

let selectedOfferName = "";
let selectedOfferPrice = "";

/* =========================
   OPEN BUY POPUP
========================= */
function openBuyPopup(name, price) {

    selectedOfferName = name;
    selectedOfferPrice = price;

    document.getElementById("popupOfferName").textContent = name;
    document.getElementById("popupOfferPrice").textContent = price;

    document.getElementById("buyPopup").style.display = "flex";
}


/* =========================
   CLOSE BUY POPUP
========================= */
function closeBuyPopup() {

    document.getElementById("buyPopup").style.display = "none";

}


/* =========================
   WHATSAPP
========================= */
function buyViaWhatsApp() {

    const customerNumber =
        document.getElementById("customerNumber").value.trim();

    if (customerNumber === "") {

        alert("যে নাম্বারে অফারটি নিতে চান সেই নাম্বারটি দিন।");

        return;
    }

    if (!/^01[0-9]{9}$/.test(customerNumber)) {

        alert("সঠিক ১১ সংখ্যার মোবাইল নাম্বার দিন।");

        return;
    }

    const message =
        "আসসালামু আলাইকুম।%0A%0A" +
        "আমি একটি অফার নিতে চাই।%0A%0A" +
        "অফার: " +
        encodeURIComponent(selectedOfferName) +
        "%0A" +
        "মূল্য: ৳" +
        encodeURIComponent(selectedOfferPrice) +
        "%0A" +
        "যে নাম্বারে অফার নিতে চাই: " +
        encodeURIComponent(customerNumber) +
        "%0A%0A" +
        "আমি Send Money করেছি।%0A" +
        "পেমেন্টের Screenshot সংযুক্ত করছি।";

    const whatsappURL =
        "https://wa.me/8801837976455?text=" + message;

    window.open(whatsappURL, "_blank");
}


/* =========================
   CLOSE WHEN OUTSIDE CLICK
========================= */
document.addEventListener("click", function(event) {

    const popup =
        document.getElementById("buyPopup");

    if (event.target === popup) {

        closeBuyPopup();

    }

});


/* =========================
   ALL BUY NOW BUTTONS
========================= */
document.addEventListener("DOMContentLoaded", function() {

    const buttons =
        document.querySelectorAll(".offer button");

    buttons.forEach(function(button) {

        button.addEventListener("click", function() {

            const offer =
                button.closest(".offer");

            if (!offer) return;

            const name =
                offer.querySelector("b")
                .textContent
                .trim();

            const price =
                offer.querySelector("strong")
                .textContent
                .replace("৳", "")
                .trim();

            openBuyPopup(name, price);

        });

    });

});

</script>
