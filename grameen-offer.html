<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>গ্রামীণ অফার</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #222;
        }

        .header {
            background: #d4148e;
            color: white;
            text-align: center;
            padding: 25px 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
        }

        .header p {
            margin: 10px 0 0;
            font-size: 20px;
        }

        .search-box {
            margin: 25px 20px;
            padding: 18px;
            border-radius: 25px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.15);
            font-size: 25px;
            color: #777;
        }

        .tabs {
            display: flex;
            background: #d4148e;
            color: white;
            padding: 15px 5px;
            justify-content: space-around;
            font-size: 17px;
        }

        .tabs span:first-child {
            color: yellow;
        }

        .empty {
            text-align: center;
            padding: 120px 25px;
        }

        .empty .icon {
            font-size: 80px;
            margin-bottom: 30px;
        }

        .empty h2 {
            color: #d4148e;
            font-size: 27px;
            line-height: 1.5;
        }

        .empty p {
            color: #777;
            font-size: 19px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>গ্রামীণ অফার</h1>
        <p>রাকিব ফ্রিল্যান্সার</p>
    </div>

    <div class="search-box">
        🔵 Search
    </div>

    <div class="tabs">
        <span>All</span>
        <span>Minutes</span>
        <span>Internet</span>
        <span>Bundles</span>
        <span>Call Rate</span>
    </div>

    <div class="empty">

        <div class="icon">🎁</div>

        <h2>
            গ্রামীণ এর অফারগুলো শীঘ্রই<br>
            যোগ করা হবে
        </h2>

        <p>
            আমরা আপনার জন্য সেরা অফার নিয়ে আসছি।<br>
            অনুগ্রহ করে কিছুক্ষণ অপেক্ষা করুন।
        </p>

    </div>

</body>
</html>
