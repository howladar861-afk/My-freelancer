*{

    padding:0;
    box-sizing:border-box;

html,body{

    color:#222;

/* ================= HEADER ================= */

.header{
    background:#009b4d;
    color:#fff;
    text-align:center;
    padding:42px 15px 25px;
}

.header h1{
    font-size:38px;
    font-weight:800;
    margin-bottom:14px;
}

.header p{
    font-size:25px;
    font-weight:700;
}

/* ================= SEARCH ================= */

.search-area{
    background:#009b4d;
    padding:20px 28px 28px;
}

.search-box{
    width:100%;
    max-width:900px;
    height:76px;
    margin:auto;

    background:#fff;
    border-radius:30px;

    display:flex;
    align-items:center;

    padding:0 24px;

    box-shadow:0 8px 25px rgba(0,0,0,.10);
}

.search-icon{
    color:#009b4d;
    font-size:42px;
    font-weight:bold;
    margin-right:15px;
}

.search-box input{
    width:100%;
    height:100%;

    border:0;
    outline:0;

    font-size:24px;
    background:transparent;
}

.search-box input::placeholder{
    color:#777;
}

/* ================= CATEGORY ================= */

.categories{
    width:100%;
    background:#009b4d;

    display:flex;
    align-items:center;

    overflow-x:auto;
    padding:0 10px;

    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    flex:0 0 auto;

    color:#fff;

    font-size:22px;
    font-weight:700;

    padding:23px 25px 18px;

    cursor:pointer;

    position:relative;
    white-space:nowrap;
}

.category.active{
    color:#ffff00;
}

.category.active::after{
    content:"";

    position:absolute;

    left:16px;
    right:16px;
    bottom:0;

    height:5px;

    background:#ffff00;

    border-radius:5px;
}

/* ================= OFFER LIST ================= */

#offerList{
    width:100%;
    max-width:1000px;

    margin:auto;

    padding:18px 14px 80px;
}

.offer-card{
    background:#fff;

    border:1px solid #ddd;
    border-radius:20px;

    margin-bottom:18px;
    padding:20px 18px 16px;

    box-shadow:0 3px 10px rgba(0,0,0,.06);

    position:relative;
    overflow:hidden;
}

.offer-top{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:15px;
}

.offer-content{
    flex:1;
}

.offer-title{
    font-size:22px;
    line-height:1.45;

    font-weight:800;

    margin-bottom:7px;
}

.offer-description{
    color:#555;
    font-size:17px;

    margin-bottom:10px;
}

.offer-price-line{
    display:flex;
    align-items:center;

    gap:10px;
    flex-wrap:wrap;
}

.original-price{
    color:#f15b35;
    font-size:17px;

    text-decoration:line-through;
}

.buy-price{
    color:#009b4d;

    font-size:22px;
    font-weight:800;
}

.buy-btn{
    min-width:125px;
    height:55px;

    border:0;
    border-radius:14px;

    background:#009b4d;
    color:#fff;

    font-size:18px;
    font-weight:800;

    cursor:pointer;

    box-shadow:0 4px 10px rgba(0,155,77,.25);
}

.buy-btn:active{
    transform:scale(.97);
}

.offer-bottom{
    display:flex;
    align-items:center;

    gap:10px;

    margin-top:14px;

    flex-wrap:wrap;
}

.category-tag{
    background:#8589ee;
    color:#fff;

    border-radius:16px;

    padding:7px 15px;

    font-size:15px;
    font-weight:700;
}

.validity{
    background:#eee;

    border-radius:20px;

    padding:8px 14px;

    color:#c32a9d;

    font-size:15px;
    font-weight:700;
}

.discount{
    position:absolute;

    top:0;
    right:0;

    background:#8589ee;
    color:#fff;

    padding:7px 13px;

    border-radius:0 0 0 20px;

    font-size:14px;
    font-weight:700;
}

/* ================= NO RESULT ================= */

.no-result{
    text-align:center;

    padding:70px 20px;

    color:#777;

    font-size:21px;
}

/* ================= PAYMENT POPUP ================= */

.modal-overlay{
    display:none;

    position:fixed;

    z-index:9999;

    inset:0;

    background:rgba(0,0,0,.65);

    padding:20px;

    overflow-y:auto;
}

.modal-overlay.show{
    display:flex;

    align-items:center;
    justify-content:center;
}

.payment-modal{
    width:100%;
    max-width:620px;

    background:#fff;

    border-radius:30px;

    padding:25px;

    position:relative;

    box-shadow:0 20px 60px rgba(0,0,0,.35);

    overflow-y:auto;

.close-btn{

    background:transparent;

    font-size:40px;
    font-weight:bold;

    cursor:pointer;

    color:#333;

.payment-title{

    font-weight:800;

.selected-offer{

.selected-price{
    font-size:22px;
    font-weight:800;

    margin-bottom:18px;

.warning{

    margin-bottom:18px;

.payment-number{

    font-size:20px;
    font-weight:700;

    margin-bottom:12px;

.payment-number:active{

.form-label{

    font-weight:700;

    margin:18px 0 8px;

.form-input{

    height:54px;

    padding:0 15px;

    font-size:18px;

    outline:none;

.form-input:focus{

.file-input{

/* =========================================================

========================================================= */

let selectedCategory = "all";

let selectedOffer = null;

const offerList =
    document.getElementById("offerList");

const searchInput =
    document.getElementById("searchInput");

const categories =
    document.querySelectorAll(".category");


/* =========================================================
   SHOW OFFERS
========================================================= */

function showOffers(){

    const searchText =
        searchInput.value
        .trim()
        .toLowerCase();


    const filteredOffers =
        offers.filter(function(offer){

            const categoryMatch =
                selectedCategory === "all" ||
                offer.category === selectedCategory;


            const searchMatch =
                offer.title
                .toLowerCase()
                .includes(searchText)

                ||

                offer.description
                .toLowerCase()
                .includes(searchText)

                ||

                offer.validity
                .toLowerCase()
                .includes(searchText);


            return categoryMatch && searchMatch;

        });


    offerList.innerHTML = "";


    if(filteredOffers.length === 0){

        offerList.innerHTML = `
            <div class="no-result">
                কোনো অফার পাওয়া যায়নি।
            </div>
        `;

        return;

    }


    filteredOffers.forEach(function(offer){

        const discount =
            offer.sellPrice - offer.buyPrice;


        const card =
            document.createElement("div");

        card.className = "offer-card";


        card.innerHTML = `

            ${
                discount > 0
                ?
                `<div class="discount">
                    +৳${discount}
                </div>`
                :
                ""
            }

            <div class="offer-top">

                <div class="offer-content">

                    <div class="offer-title">
                        ${offer.title}
                    </div>

                    <div class="offer-description">
                        ${offer.description}
                    </div>

                    <div class="offer-price-line">

                        <span class="original-price">
                            Buy Now ৳${offer.buyPrice}
                        </span>

                        <span class="buy-price">
                            ৳${offer.sellPrice}
                        </span>

                    </div>

                </div>


                <button
                    class="buy-btn"
                    onclick="openPayment(${offer.id})"
                >
                    Buy Now
                </button>

            </div>


            <div class="offer-bottom">

                <span class="category-tag">
                    ${getCategoryName(offer.category)}
                </span>

                <span class="validity">
                    ⏱ ${offer.validity}
                </span>

            </div>

        `;


        offerList.appendChild(card);

    });

}
