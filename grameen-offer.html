<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>টেলিটক অফার - রাকিব ফ্রিল্যান্সার</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #111;
        }

        .header {
            background: #d91b8f;
            color: white;
            text-align: center;
            padding: 20px 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .header p {
            margin: 10px 0 0;
            font-size: 20px;
        }

        .search-box {
            margin: 25px 20px;
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.15);
            font-size: 25px;
            color: #777;
        }

        .categories {
            display: flex;
            overflow-x: auto;
            background: #d91b8f;
            color: white;
            padding: 15px 10px;
            gap: 30px;
            font-size: 18px;
        }

        .categories div {
            white-space: nowrap;
        }

        .empty {
            text-align: center;
            padding: 100px 25px;
        }

        .empty-icon {
            font-size: 90px;
            opacity: 0.5;
        }

        .empty h2 {
            color: #d91b8f;
            font-size: 28px;
            line-height: 1.5;
        }

        .empty p {
            color: #777;
            font-size: 20px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>টেলিটক অফার</h1>
        <p>রাকিব ফ্রিল্যান্সার</p>
    </div>

    <div class="search-box">
        🔷 &nbsp; Search
    </div>

    <div class="categories">
        <div>All</div>
        <div>Minutes</div>
        <div>Internet</div>
        <div>Bundles</div>
        <div>Call Rate</div>
    </div>

    <!-- OFFER LIST -->
    <div class="empty">

        <div class="empty-icon">
            🎁
        </div>

        <h2>
            টেলিটক এর অফারগুলো শীঘ্রই<br>
            যোগ করা হবে
        </h2>

        <p>
            আমরা আপনার জন্য সেরা অফার নিয়ে আসছি।
            <br>
            অনুগ্রহ করে কিছুক্ষণ অপেক্ষা করুন।
        </p>

    </div>

</body>
</html>
