<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram Group</title>

<style>

  min-height:100vh;
  display:flex;

  justify-content:center;
  background:#f3f6ff;
  font-family:Arial,sans-serif;
}

.card{
  width:85%;
  max-width:420px;
  background:white;
  padding:30px 25px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.icon{
  font-size:60px;
  margin-bottom:15px;
}

h1{
  font-size:27px;
  color:#222;
}

p{
  font-size:18px;
  line-height:1.6;
  color:#555;
}

.group-name{
  font-weight:bold;
  color:#168de2;
}

.join-btn{
  display:block;
  padding:15px;
  background:#168de2;
  color:white;
  text-decoration:none;
  border-radius:12px;
  font-size:20px;
  font-weight:bold;
  margin-top:25px;
}
</style>
</head>

<body>

<div class="card">

  <div class="icon">✈️</div>

  <h1>টেলিগ্রাম গ্রুপে জয়েন করুন</h1>

  <p>
    কাজের আপডেট পেতে<br>
    <span class="group-name">
      Rakib Freelancer Official Group
    </span>
  </p>

  <a
    class="join-btn"
    href="https://t.me/bdjobs1234"
    target="_blank"
  >
    ✈️ Join Now
  </a>

</div>

</body>
</html>
