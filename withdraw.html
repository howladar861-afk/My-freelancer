<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdraw</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #222;
    }

    .header {
      background: #f5b800;
      color: white;
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
    }

    .box {
      width: 90%;
      max-width: 420px;
      margin: 30px auto;
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-sizing: border-box;
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    .balance {
      background: #f1f5f9;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      margin: 20px 0;
      font-size: 18px;
      font-weight: bold;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    select,
    input {
      width: 100%;
      padding: 13px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    .submit-btn {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .back-btn {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #ddd;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="header">
    Withdraw
  </div>

  <div class="box">

    <h2>💸 টাকা Withdraw</h2>

    <div class="balance">
  বর্তমান ব্যালেন্স: ৳<span id="withdrawBalance">0.00</span>
    </div>

    <label>Payment Method</label>

    <select id="withdrawMethod">
      <option value="">নির্বাচন করুন</option>
      <option value="bkash">bKash</option>
      <option value="nagad">Nagad</option>
    </select>

    <label>যে নম্বরে টাকা নেবেন</label>

    <input
      type="tel"
      id="withdrawNumber"
      placeholder="01XXXXXXXXX"
    >

    <label>Withdraw Amount</label>

    <input
      type="number"
      id="withdrawAmount"
      placeholder="টাকার পরিমাণ"
      min="1"
    >

    <button class="submit-btn" onclick="submitWithdraw()">
      Withdraw Request
    </button>

    <button class="back-btn" onclick="history.back()">
      Back
    </button>

  </div>

  <script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  collection,
  runTransaction
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyBFUKPT7fo6sUofdO09ffiZgjdlaR5evm8",
  authDomain: "rakib-freelancer-9c66b.firebaseapp.com",
  projectId: "rakib-freelancer-9c66b",
  storageBucket: "rakib-freelancer-9c66b.firebasestorage.app",
  messagingSenderId: "541209844482",
  appId: "1:541209844482:web:510568d5226c9bf47ac01b"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let withdrawProcessing = false;
// Account Verification Check
onAuthStateChanged(auth, async (user) => {

  if (!user) {
    alert("প্রথমে Login করুন।");
    window.location.href = "index.html";
    return;
  }

  const userRef = doc(db, "users", user.uid);
  const userSnap = await getDoc(userRef);

  if (!userSnap.exists()) {
    alert("Account Verification প্রয়োজন।");
    window.location.href = "verification.html";
    return;
  }

  const userData = userSnap.data();
const balance = Number(userData.balance || 0);

const balanceElement =
  document.getElementById("withdrawBalance");

if (balanceElement) {
  balanceElement.textContent =
    balance.toFixed(2);
}
  if (userData.verified !== true) {
    alert("Withdraw করতে আগে Account Verification সম্পন্ন করুন।");
    window.location.href = "verification.html";
    return;
  }

});


// Withdraw Button
window.submitWithdraw = async function () {

  if (withdrawProcessing) {
    alert("Withdraw request already processing.");
    return;
  }

  withdrawProcessing = true;

  const user = auth.currentUser;

if (!user) {
  alert("আগে Login করুন");
  window.location.href = "index.html";
  return;
}

const userRef = doc(db, "users", user.uid);
const userSnap = await getDoc(userRef);

if (!userSnap.exists()) {
  alert("Account Verification প্রয়োজন");
  window.location.href = "verification.html";
  return;
}

const userData = userSnap.data();

if (userData.verified !== true) {
  alert("Withdraw করতে আগে Account Verification সম্পন্ন করুন");
  window.location.href = "verification.html";
  return;
}
  const method =
    document.getElementById("withdrawMethod").value;

  const number =
    document.getElementById("withdrawNumber").value.trim();

  const amount =
    document.getElementById("withdrawAmount").value.trim();


  if (!method || !number || !amount) {
    alert("সব তথ্য পূরণ করুন।");
    withdrawProcessing = false;
    return;
  }

  if (Number(amount) <= 0) {
    alert("সঠিক টাকার পরিমাণ দিন।");
    withdrawProcessing = false;
    return;
  }

  try {
  const withdrawAmount = Number(amount);

  const requestRef = doc(collection(db, "withdrawRequests"));

  await runTransaction(db, async (transaction) => {

    const freshSnap = await transaction.get(userRef);

    if (!freshSnap.exists()) {
      throw new Error("USER_NOT_FOUND");
    }

    const freshData = freshSnap.data();

const currentBalance = Number(freshData.balance || 0);

// Minimum balance check
if (currentBalance < 100) {
  throw new Error("MINIMUM_BALANCE");
}

// Withdraw amount balance-এর চেয়ে বেশি কিনা
if (withdrawAmount > currentBalance) {
  throw new Error("INSUFFICIENT_BALANCE");
}

const newBalance = currentBalance - withdrawAmount;

    // User balance থেকে টাকা কাটা
    transaction.update(userRef, {
      balance: newBalance
    });

    // Admin Panel-এর জন্য Withdraw Request তৈরি
    transaction.set(requestRef, {
      userId: user.uid,
      email: user.email,
      method: method,
      number: number,
      amount: withdrawAmount,
      status: "pending",
      createdAt: new Date().toISOString()
    });
  });

  // সফল হলে
  document.getElementById("withdrawBalance").textContent =
    (Number(amount) > 0 ? "৳" + (Number(userData.balance || 0) - Number(amount)).toFixed(2) : "৳0.00");

  alert("Withdraw Request সফলভাবে পাঠানো হয়েছে।");

} catch (error) {

  if (error.message === "MINIMUM_BALANCE") {

  alert("আপনার একাউন্টে 100 টাকার কম আছে। Withdraw Request যাবে না।");

} else if (error.message === "INSUFFICIENT_BALANCE") {

  alert("আপনার ব্যালেন্সের চেয়ে বেশি টাকা Withdraw করা যাবে না।");

} else {

  console.error("WITHDRAW ERROR:", error);

alert(
  "Withdraw Request পাঠানো যায়নি!\n\n" +
  "Code: " + (error.code || "unknown") +
  "\n\nMessage: " + (error.message || error)
);

  }

  }finally {

  withdrawProcessing = false;

    }

};

  </script>

</body>
</html>
