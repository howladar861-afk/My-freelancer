<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdraw</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #222;
    }

    .header {
      background: #f5b800;
      color: white;
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
    }

    .box {
      width: 90%;
      max-width: 420px;
      margin: 30px auto;
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-sizing: border-box;
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    .balance {
      background: #f1f5f9;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      margin: 20px 0;
      font-size: 18px;
      font-weight: bold;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    select,
    input {
      width: 100%;
      padding: 13px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    .submit-btn {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .back-btn {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #ddd;
      font-size: 16px;
    }
    /* Withdraw Popup */
.withdraw-popup-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:9999;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.withdraw-popup{
  width:100%;
  max-width:390px;
  background:#fff;
  border-radius:25px;
  overflow:hidden;
  animation:popup .3s ease;
}

@keyframes popup{
  from{transform:scale(.8);opacity:0}
  to{transform:scale(1);opacity:1}
}

.withdraw-popup-head{
  text-align:center;
  padding:25px 15px 18px;
  background:#ecfdf5;
}

.withdraw-success{
  width:65px;
  height:65px;
  margin:auto;
  border-radius:50%;
  background:#16a34a;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  font-weight:bold;
}

.withdraw-popup-head h2{
  color:#15803d;
  margin:12px 0 5px;
}

.withdraw-popup-head p{
  color:#64748b;
  margin:0;
}

.withdraw-details{
  margin:18px;
  padding:5px 15px;
  background:#f8fafc;
  border-radius:15px;
}

.withdraw-row{
  display:flex;
  justify-content:space-between;
  padding:13px 0;
  border-bottom:1px solid #e2e8f0;
  font-size:14px;
}

.withdraw-row:last-child{
  border-bottom:0;
}

.withdraw-value{
  font-weight:bold;
}

.withdraw-fee{
  color:#dc2626;
}

.withdraw-receive{
  color:#16a34a;
  font-size:17px;
}

.withdraw-status{
  background:#fef3c7;
  color:#b45309;
  padding:5px 10px;
  border-radius:15px;
}

.withdraw-ok{
  width:calc(100% - 36px);
  margin:0 18px 20px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#16a34a;
  color:white;
  font-size:17px;
  font-weight:bold;
}
  </style>
</head>

<body>

  <div class="header">
    Withdraw
  </div>

  <div class="box">

    <h2>💸 টাকা Withdraw</h2>

    <div class="balance">
  বর্তমান ব্যালেন্স: ৳<span id="withdrawBalance">0.00</span>
    </div>

    <label>Payment Method</label>

    <select id="withdrawMethod">
      <option value="">নির্বাচন করুন</option>
      <option value="bkash">bKash</option>
      <option value="nagad">Nagad</option>
    </select>

    <label>যে নম্বরে টাকা নেবেন</label>

    <input
      type="tel"
      id="withdrawNumber"
      placeholder="01XXXXXXXXX"
    >

    <label>Withdraw Amount</label>

    <input
  type="number"
  id="withdrawAmount"
  placeholder="ন্যূনতম 100 টাকা"
  min="100"
>

    <button class="submit-btn" onclick="submitWithdraw()">
      Withdraw Request
    </button>

    <button class="back-btn" onclick="history.back()">
      Back
    </button>

  </div>
<!-- Withdraw Popup -->
<div class="withdraw-popup-overlay" id="withdrawPopup">

  <div class="withdraw-popup">

    <div class="withdraw-popup-head">

      <div class="withdraw-success">✓</div>

      <h2>উইথড্র সফল হয়েছে!</h2>

      <p>আপনার Withdraw Request গ্রহণ করা হয়েছে</p>

    </div>

    <div class="withdraw-details">

      <div class="withdraw-row">
        <span>💰 Withdraw Amount</span>
        <span class="withdraw-value" id="popAmount">৳0.00</span>
      </div>

      <div class="withdraw-row">
        <span>💳 Withdraw Fee (২%)</span>
        <span class="withdraw-value withdraw-fee" id="popFee">-৳0.00</span>
      </div>

      <div class="withdraw-row">
        <span>💵 আপনি পাবেন</span>
        <span class="withdraw-value withdraw-receive" id="popReceive">৳0.00</span>
      </div>

      <div class="withdraw-row">
        <span>📅 তারিখ ও সময়</span>
        <span class="withdraw-value" id="popDate">-</span>
      </div>

      <div class="withdraw-row">
        <span>📱 Payment</span>
        <span class="withdraw-value" id="popMethod">-</span>
      </div>

      <div class="withdraw-row">
        <span>📌 Status</span>
        <span class="withdraw-status">Pending</span>
      </div>

    </div>

    <button class="withdraw-ok" onclick="closeWithdrawPopup()">
      ✓ ঠিক আছে
    </button>

  </div>

</div>
  <script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  collection,
  runTransaction
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyBFUKPT7fo6sUofdO09ffiZgjdlaR5evm8",
  authDomain: "rakib-freelancer-9c66b.firebaseapp.com",
  projectId: "rakib-freelancer-9c66b",
  storageBucket: "rakib-freelancer-9c66b.firebasestorage.app",
  messagingSenderId: "541209844482",
  appId: "1:541209844482:web:510568d5226c9bf47ac01b"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let withdrawProcessing = false;
// Account Verification Check
onAuthStateChanged(auth, async (user) => {

  if (!user) {
    alert("প্রথমে Login করুন।");
    window.location.href = "index.html";
    return;
  }

  const userRef = doc(db, "users", user.uid);
  const userSnap = await getDoc(userRef);

  if (!userSnap.exists()) {
    alert("Account Verification প্রয়োজন।");
    window.location.href = "verification.html";
    return;
  }

  const userData = userSnap.data();
const balance = Number(userData.balance || 0);

const balanceElement =
  document.getElementById("withdrawBalance");

if (balanceElement) {
  balanceElement.textContent =
    balance.toFixed(2);
}
  if (userData.verified !== true) {
    alert("Withdraw করতে আগে Account Verification সম্পন্ন করুন।");
    window.location.href = "verification.html";
    return;
  }

});


// Withdraw Button
window.submitWithdraw = async function () {

  if (withdrawProcessing) {
    alert("Withdraw request already processing.");
    return;
  }

  withdrawProcessing = true;

  const user = auth.currentUser;

if (!user) {
  alert("আগে Login করুন");
  window.location.href = "index.html";
  return;
}

const userRef = doc(db, "users", user.uid);
const userSnap = await getDoc(userRef);

if (!userSnap.exists()) {
  alert("Account Verification প্রয়োজন");
  window.location.href = "verification.html";
  return;
}

const userData = userSnap.data();

if (userData.verified !== true) {
  alert("Withdraw করতে আগে Account Verification সম্পন্ন করুন");
  window.location.href = "verification.html";
  return;
}
  const method =
    document.getElementById("withdrawMethod").value;

  const number =
    document.getElementById("withdrawNumber").value.trim();

  const amount =
    document.getElementById("withdrawAmount").value.trim();


  if (!method || !number || !amount) {
    alert("সব তথ্য পূরণ করুন।");
    withdrawProcessing = false;
    return;
  }

  if (Number(amount) <= 0) {
    alert("সঠিক টাকার পরিমাণ দিন।");
    withdrawProcessing = false;
    return;
  }
if (Number(amount) < 100) {
  alert("ন্যূনতম 100 টাকা Withdraw করতে পারবেন।");
  withdrawProcessing = false;
  return;
}
  try {
  const withdrawAmount = Number(amount);
const withdrawFee = withdrawAmount * 0.02;
const receiveAmount = withdrawAmount - withdrawFee;
  const requestRef = doc(collection(db, "withdrawRequests"));

  await runTransaction(db, async (transaction) => {

    const freshSnap = await transaction.get(userRef);

    if (!freshSnap.exists()) {
      throw new Error("USER_NOT_FOUND");
    }

    const freshData = freshSnap.data();

const currentBalance = Number(freshData.balance || 0);

// Minimum balance check
if (currentBalance < 100) {
  throw new Error("MINIMUM_BALANCE");
}

// Withdraw amount balance-এর চেয়ে বেশি কিনা
if (withdrawAmount > currentBalance) {
  throw new Error("INSUFFICIENT_BALANCE");
}

const newBalance = currentBalance - withdrawAmount;

    // User balance থেকে টাকা কাটা
    transaction.update(userRef, {
      balance: newBalance
    });

    // Admin Panel-এর জন্য Withdraw Request তৈরি
    transaction.set(requestRef, {
      userId: user.uid,
      email: user.email,
      method: method,
      number: number,
      amount: withdrawAmount,
fee: withdrawFee,
receiveAmount: receiveAmount,
status: "pending",
      createdAt: new Date().toISOString()
    });
  });

  // সফল হলে
  document.getElementById("withdrawBalance").textContent =
    (Number(amount) > 0 ? "৳" + (Number(userData.balance || 0) - Number(amount)).toFixed(2) : "৳0.00");

  showWithdrawPopup(
  withdrawAmount,
  withdrawFee,
  receiveAmount,
  method
);

} catch (error) {

  if (error.message === "MINIMUM_BALANCE") {

  alert("আপনার একাউন্টে 100 টাকার কম আছে। Withdraw Request যাবে না।");

} else if (error.message === "INSUFFICIENT_BALANCE") {

  alert("আপনার ব্যালেন্সের চেয়ে বেশি টাকা Withdraw করা যাবে না।");

} else {

  console.error("WITHDRAW ERROR:", error);

alert(
  "Withdraw Request পাঠানো যায়নি!\n\n" +
  "Code: " + (error.code || "unknown") +
  "\n\nMessage: " + (error.message || error)
);

  }

  }finally {

  withdrawProcessing = false;

    }

};
function showWithdrawPopup(amount, fee, receive, method) {

  document.getElementById("popAmount").textContent =
    "৳" + amount.toFixed(2);

  document.getElementById("popFee").textContent =
    "-৳" + fee.toFixed(2);

  document.getElementById("popReceive").textContent =
    "৳" + receive.toFixed(2);

  document.getElementById("popMethod").textContent =
    method === "bkash" ? "bKash" : "Nagad";

  const now = new Date();

  document.getElementById("popDate").textContent =
    now.toLocaleDateString("bn-BD") +
    " • " +
    now.toLocaleTimeString("bn-BD", {
      hour: "2-digit",
      minute: "2-digit"
    });

  document.getElementById("withdrawPopup").style.display =
    "flex";
}


function closeWithdrawPopup() {

  document.getElementById("withdrawPopup").style.display =
    "none";

  window.closeWithdrawPopup = closeWithdrawPopup;
}
  </script>

</body>
</html>
