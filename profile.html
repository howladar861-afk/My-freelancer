<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#07172a,#123b73,#2563eb);
    color:#fff;
    padding-bottom:90px;
}

.header{
    padding:22px 18px;
    background:rgba(255,255,255,.10);
    backdrop-filter:blur(12px);
    text-align:center;
    box-shadow:0 4px 20px rgba(0,0,0,.25);
}

.header h2{
    font-size:24px;
}

.profile-box{
    width:92%;
    max-width:500px;
    margin:30px auto;
    background:rgba(255,255,255,.95);
    color:#222;
    border-radius:22px;
    padding:30px 20px;
    text-align:center;
    box-shadow:0 10px 35px rgba(0,0,0,.25);
}

.avatar{
    width:100px;
    height:100px;
    margin:0 auto 15px;
    border-radius:50%;
    background:#2563eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:52px;
    box-shadow:0 5px 20px rgba(37,99,235,.4);
}

.profile-box h1{
    font-size:25px;
    margin-bottom:8px;
}

.email{
    color:#666;
    margin-bottom:25px;
    word-break:break-word;
}

.info{
    text-align:left;
    margin-top:15px;
}

.info-item{
    background:#f4f7fb;
    border-radius:12px;
    padding:15px;
    margin:10px 0;
}

.info-item strong{
    display:block;
    color:#2563eb;
    margin-bottom:5px;
}

.logout{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    font-size:17px;
    cursor:pointer;
}

.logout:hover{
    background:#174fc1;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#fff;
    color:#777;
    display:flex;
    justify-content:space-around;
    padding:10px 0 8px;
    box-shadow:0 -3px 15px rgba(0,0,0,.18);
}

.nav-item{
    text-align:center;
    font-size:12px;
    cursor:pointer;
}

.nav-item .icon{
    font-size:24px;
    margin-bottom:3px;
}

.nav-item.active{
    color:#2563eb;
    font-weight:bold;
}

@media(max-width:600px){
    .profile-box{
        margin-top:20px;
        padding:25px 16px;
    }

    .header h2{
        font-size:21px;
    }
}
    .edit-profile-btn{
    width:100%;
    padding:14px;
    margin:10px 0 20px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.edit-profile-btn:hover{
    background:#174fc1;
}
</style>
</head>

<body>

<div class="header">
    <h2>👤 My Profile</h2>
</div>

<div class="profile-box">

    <div class="avatar">👤</div>

    <h1 id="profileName">Loading...</h1>

    <p class="email" id="profileEmail">
        Loading...
    </p>

    <button class="edit-profile-btn" id="editProfileBtn">
    ✏️ Profile Edit
    </button>
    <div class="info">

        <div class="info-item">
            <strong>Referral Code</strong>
            <span id="referralCode">Loading...</span>
        </div>

        <div class="info-item">
            <strong>Referral Count</strong>
            <span id="referralCount">0</span>
        </div>
<!-- Verification Section -->
<div class="info-item" style="margin-top:15px;">

    <strong>✅ Account Verification</strong>

    <p id="verificationStatus"
       style="margin:8px 0;color:#666;">
        আপনার অ্যাকাউন্ট এখনো Verified নয়।
    </p>

    <button
  id="verifyBtn"
  onclick="document.getElementById('verificationForm').style.display='block'; this.style.display='none';"
  style="
    width:100%;
    padding:13px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#16a34a;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
  "
>
  💳 Verify Account — ৳100
    </button>
<!-- Verification Form -->
<div id="verificationForm"
     style="display:none;margin-top:15px;background:#f4f7fb;padding:15px;border-radius:12px;">

    <strong style="color:#2563eb;font-size:18px;">
        💳 Account Verification
    </strong>

    <p style="color:#555;margin:10px 0;">
        ৳100 পাঠানোর পর নিচের তথ্য দিন।
    </p>

    <select id="paymentMethod"
            style="width:100%;padding:13px;border:1px solid #ddd;border-radius:8px;margin-bottom:10px;">
        <option value="">Payment Method নির্বাচন করুন</option>
        <option value="bKash">bKash</option>
        <option value="Nagad">Nagad</option>
    </select>

    <input
        type="text"
        id="senderNumber"
        placeholder="যে নম্বর থেকে টাকা পাঠিয়েছেন"
        style="width:100%;padding:13px;border:1px solid #ddd;border-radius:8px;margin-bottom:10px;"
    >

    <input
        type="text"
        id="transactionId"
        placeholder="Transaction ID লিখুন"
        style="width:100%;padding:13px;border:1px solid #ddd;border-radius:8px;margin-bottom:10px;"
    >

    <button
  id="submitVerification"
  type="button"
  style="
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
">
  ✅ Submit Verification
    </button>

</div>
</div>
    </div>

    <button class="logout" id="logoutBtn">
        Logout
    </button>

</div>

<div class="bottom-nav">

    <div class="nav-item" onclick="window.location.href='dashboard.html'">
        <div class="icon">🏠</div>
        Home
    </div>

    <div class="nav-item">
        <div class="icon">🎬</div>
        Reels
    </div>

    <div class="nav-item">
        <div class="icon">🛒</div>
        Reselling
    </div>

    <div class="nav-item">
        <div class="icon">💼</div>
        Micro Job
    </div>

    <div class="nav-item active">
        <div class="icon">👤</div>
        Profile
    </div>

</div>

<script type="module">
alert("JavaScript চলছে ✅");
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  addDoc,
  collection,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBFUKPT76os6u0d09ff1jZgjdIaR5ew8m",
    authDomain: "rakib-freelancer-9c66b.firebaseapp.com",
    projectId: "rakib-freelancer-9c66b",
    storageBucket: "rakib-freelancer-9c66b.firebasestorage.app",
    messagingSenderId: "541209844482",
    appId: "1:541209844482:web:5105685226c9bf47ac01b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
    await setPersistence(auth, browserLocalPersistence);

    const authReady = new Promise((resolve) => {
    const unsubscribe = onAuthStateChanged(auth, (user) => {
        unsubscribe();
        resolve(user);
    });
});

async function getLoggedInUser() {
    if (auth.currentUser) {
        return auth.currentUser;
    }

    return await authReady;
}
let currentUser = null;
    
onAuthStateChanged(auth, async (user) => {
    
currentUser = user;
    
    if(user){

        document.getElementById("profileEmail").textContent =
            user.email || "No Email";

        const userDoc = await getDoc(
            doc(db, "users", user.uid)
        );

        if(userDoc.exists()){

            const data = userDoc.data();

            document.getElementById("profileName").textContent =
    data.name || user.displayName || "Profile";

            document.getElementById("referralCode").textContent =
                data.referralCode || "Not Found";

        }else{

            document.getElementById("profileName").textContent =
                "My Profile";

            document.getElementById("referralCode").textContent =
                "Not Found";
        }

}else{

    document.getElementById("profileName").textContent = "Profile";
    document.getElementById("profileEmail").textContent = "Please login first";
    document.getElementById("referralCode").textContent = "Not Available";
    document.getElementById("referralCount").textContent = "0";

    }

});

document.getElementById("editProfileBtn").onclick = async () => {

    // Firebase login status নিশ্চিত হওয়া পর্যন্ত অপেক্ষা করবে
    const user = await new Promise((resolve) => {
        const unsubscribe = onAuthStateChanged(auth, (user) => {
            unsubscribe();
            resolve(user);
        });
    });


    const userRef = doc(db, "users", user.uid);
    const userDoc = await getDoc(userRef);

    const data = userDoc.exists() ? userDoc.data() : {};

    const oldName = data.name || user.displayName || "";

    const newName = prompt(
        "আপনার নতুন নাম লিখুন:",
        oldName
    );

    if (!newName || newName.trim() === "") {
        return;
    }

    await updateDoc(userRef, {
        name: newName.trim()
    });

    document.getElementById("profileName").textContent =
        newName.trim();

    alert("Profile নাম সফলভাবে পরিবর্তন হয়েছে ✅");
};

    document.getElementById("verifyBtn").onclick = function () {
    document.getElementById("verificationForm").style.display = "block";

    document.getElementById("verifyBtn").style.display = "none";
};
document.getElementById("submitVerification").onclick = async function () {

    const senderNumber =
        document.getElementById("senderNumber").value.trim();

    const transactionId =
        document.getElementById("transactionId").value.trim();

    const user = auth.currentUser;

    if (!user) {
        alert("আপনার Login Session পাওয়া যাচ্ছে না। আবার Login করুন।");
        return;
    }

    if (!senderNumber || !transactionId) {
        alert("দয়া করে Sender Number এবং Transaction ID দিন!");
        return;
    }

    try {

        await addDoc(collection(db, "verificationRequests"), {
            userId: user.uid,
            userEmail: user.email || "",
            paymentMethod:
                document.getElementById("paymentMethod").value,
            senderNumber: senderNumber,
            transactionId: transactionId,
            status: "pending",
            createdAt: serverTimestamp()
        });

        alert(
            "✅ আপনার Verification Request সফলভাবে পাঠানো হয়েছে!\n\n" +
            "Admin যাচাই করে Approve বা Reject করবেন।"
        );

        document.getElementById("senderNumber").value = "";
        document.getElementById("transactionId").value = "";

    } catch (error) {

        console.error("Verification Error:", error);

        alert(
            "❌ Request পাঠানো যায়নি!\n\n" +
            error.message
        );
    }
};

document.getElementById("logoutBtn").onclick = async function () {
    try {
        await signOut(auth);
        window.location.href = "index.html";
    } catch (error) {
        console.error("Logout Error:", error);
        alert("Logout করা যায়নি: " + error.message);
    }
};
