    .container {

    .loading {

    .income-card {

    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;

    .nav-item {

<body>

  <div class="header">
    <h1>আমার ইনকাম</h1>
  </div>

  <div class="container">

    <div id="loadingBox" class="loading">
      ইনকাম লোড হচ্ছে...
    </div>

    <div id="errorBox" class="error"></div>

    <div id="incomeSection" style="display:none;">

      <div class="income-card">
        <div class="income-name">📅 আজকের ইনকাম</div>
        <div id="todayIncome" class="income-amount">৳0</div>
      </div>

      <div class="income-card">
        <div class="income-name">📆 গতকালের ইনকাম</div>
        <div id="yesterdayIncome" class="income-amount">৳0</div>
      </div>

      <div class="income-card">
        <div class="income-name">📊 গত ৭ দিনের ইনকাম</div>
        <div id="sevenDayIncome" class="income-amount">৳0</div>
      </div>

      <div class="income-card">
        <div class="income-name">📈 গত ৩০ দিনের ইনকাম</div>
        <div id="thirtyDayIncome" class="income-amount">৳0</div>
      </div>

      <div class="income-card total-card">
        <div class="income-name">💰 মোট ইনকাম</div>
        <div id="totalIncome" class="income-amount">৳0</div>
      </div>

    </div>
  </div>


  <!-- Bottom Navigation -->
  <div class="bottom-nav">

    <a href="index.html" class="nav-item">
      <span class="nav-icon">🏠</span>
      Home
    </a>

    <a href="reels.html" class="nav-item">
      <span class="nav-icon">🎬</span>

    <a href="reselling.html" class="nav-item">

    </a>

    <a href="microjob.html" class="nav-item">
      <span class="nav-icon">💼</span>

    <a href="profile.html" class="nav-item active">
      <span class="nav-icon">👤</span>

    </a>

  </div>


  <!-- Firebase -->
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    import {
      getFirestore,
      collection,
      query,
      where,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    // =====================================
    // FIREBASE CONFIG
    // =====================================

    const firebaseConfig = {
      apiKey: "AIzaSyBFUKPT7fo6sUofdO09ffiZgjdlaR5evm8",
      authDomain: "rakib-freelancer-9c66b.firebaseapp.com",
      projectId: "rakib-freelancer-9c66b",
      storageBucket: "rakib-freelancer-9c66b.firebasestorage.app",
      messagingSenderId: "541209844482",
      appId: "1:541209844482:web:510568d5226c9bf47ac01b",
      measurementId: "G-F6QNE0QN5K"
    };


    // =====================================
    // FIREBASE START
    // =====================================

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // =====================================
    // ELEMENTS
    // =====================================

    const loadingBox =
      document.getElementById("loadingBox");

    const errorBox =
      document.getElementById("errorBox");

    const incomeSection =
      document.getElementById("incomeSection");


    // =====================================
    // MONEY FORMAT
    // =====================================

    function money(amount) {

      return "৳" + Number(amount || 0)
        .toLocaleString("en-US", {
          minimumFractionDigits: 0,
          maximumFractionDigits: 2
        });

    }


    // =====================================
    // DATE CONVERT
    // =====================================

    function convertDate(value) {

      if (!value) {
        return null;
      }

      // Firebase Timestamp
      if (
        typeof value.toDate === "function"
      ) {
        return value.toDate();
      }

      // JS Date
      if (value instanceof Date) {
        return value;
      }

      // Timestamp-like object
      if (
        value.seconds !== undefined
      ) {
        return new Date(
          value.seconds * 1000
        );
      }

      // Normal date/string
      const date = new Date(value);

      if (isNaN(date.getTime())) {
        return null;
      }

      return date;
    }


    // =====================================
    // START OF DAY
    // =====================================

    function startOfDay(date) {

      const d = new Date(date);

      d.setHours(0, 0, 0, 0);

      return d;
    }


    // =====================================
    // LOAD INCOME
    // =====================================

    async function loadIncome(user) {

      try {

        const uid = user.uid;

        console.log(
          "Loading income for UID:",
          uid
        );


        // =================================
        // GET USER'S JOB SUBMISSIONS
        // =================================

        const incomeQuery = query(
          collection(
            db,
            "jobSubmissions"
          ),
          where(
            "userId",
            "==",
            uid
          )
        );


        const snapshot =
          await getDocs(incomeQuery);


        console.log(
          "Job submissions:",
          snapshot.size
        );


        // =================================
        // DATE RANGE
        // =================================

        const now = new Date();

        const todayStart =
          startOfDay(now);


        const yesterdayStart =
          new Date(todayStart);

        yesterdayStart.setDate(
          yesterdayStart.getDate() - 1
        );


        const sevenDaysStart =
          new Date(todayStart);

        sevenDaysStart.setDate(
          sevenDaysStart.getDate() - 6
        );


        const thirtyDaysStart =
          new Date(todayStart);

        thirtyDaysStart.setDate(
          thirtyDaysStart.getDate() - 29
        );


        // =================================
        // INCOME VARIABLES
        // =================================

        let todayIncome = 0;

        let yesterdayIncome = 0;

        let sevenDayIncome = 0;

        let thirtyDayIncome = 0;

        let totalIncome = 0;


        // =================================
        // LOOP
        // =================================

        snapshot.forEach((docSnap) => {

          const data =
            docSnap.data();


          // শুধুমাত্র APPROVED কাজের টাকা
          if (
            String(data.status || "")
              .toLowerCase()
              !== "approved"
          ) {
            return;
          }


          const amount =
            Number(
              data.payPerTask || 0
            );


          if (
            !amount ||
            amount < 0
          ) {
            return;
          }


          // approvedAt আগে ব্যবহার হবে
          // না থাকলে createdAt
          const incomeDate =
            convertDate(
              data.approvedAt ||
              data.createdAt
            );


          if (!incomeDate) {
            return;
          }


          // =================================
          // TOTAL
          // =================================

          totalIncome += amount;


          // =================================
          // TODAY
          // =================================

          if (
            incomeDate >= todayStart &&
            incomeDate <= now
          ) {

            todayIncome += amount;

          }


          // =================================
          // YESTERDAY
          // =================================

          if (
            incomeDate >= yesterdayStart &&
            incomeDate < todayStart
          ) {

            yesterdayIncome += amount;

          }


          // =================================
          // LAST 7 DAYS
          // =================================

          if (
            incomeDate >= sevenDaysStart &&
            incomeDate <= now
          ) {

            sevenDayIncome += amount;

          }


          // =================================
          // LAST 30 DAYS
          // =================================

          if (
            incomeDate >= thirtyDaysStart &&
            incomeDate <= now
          ) {

            thirtyDayIncome += amount;

          }

        });


        // =================================
        // DISPLAY
        // =================================

        document.getElementById(
          "todayIncome"
        ).textContent =
          money(todayIncome);


        document.getElementById(
          "yesterdayIncome"
        ).textContent =
          money(yesterdayIncome);


        document.getElementById(
          "sevenDayIncome"
        ).textContent =
          money(sevenDayIncome);


        document.getElementById(
          "thirtyDayIncome"
        ).textContent =
          money(thirtyDayIncome);


        document.getElementById(
          "totalIncome"
        ).textContent =
          money(totalIncome);


        // =================================
        // SHOW PROFILE
        // =================================

        loadingBox.style.display =
          "none";

        incomeSection.style.display =
          "block";


        console.log(
          "Income Summary:",
          {
            today: todayIncome,
            yesterday: yesterdayIncome,
            sevenDays: sevenDayIncome,
            thirtyDays: thirtyDayIncome,
            total: totalIncome
          }
        );

      }

      catch (error) {

        console.error(
          "Income Load Error:",
          error
        );


        loadingBox.style.display =
          "none";

        incomeSection.style.display =
          "none";

        errorBox.style.display =
          "block";

        errorBox.textContent =
          "❌ ইনকাম লোড করা যায়নি: " +
          (
            error.message ||
            "Unknown error"
          );

      }

    }


    // =====================================
    // AUTH
    // =====================================

    onAuthStateChanged(
      auth,
      async (user) => {

        if (!user) {

          loadingBox.style.display =
            "none";

          errorBox.style.display =
            "block";

          errorBox.textContent =
            "❌ আপনি Login করা নেই। আগে Login করুন।";

          return;

        }


        console.log(
          "Logged in UID:",
          user.uid
        );


        await loadIncome(user);

      }
    );

  </script>

</body>
