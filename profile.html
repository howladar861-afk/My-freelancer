<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Profile</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #082b57, #075dcc);
      min-height: 100vh;
      color: #1f2937;
      padding-bottom: 90px;
    }

    /* Header */
    .header {
      background: rgba(255,255,255,0.10);
      padding: 22px 15px;
      text-align: center;
      color: white;
      backdrop-filter: blur(8px);
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
    }

    .header-icon {
      font-size: 32px;
      vertical-align: middle;
    }

    /* Main */
    .container {
      max-width: 520px;
      margin: auto;
      padding: 20px 15px;
    }

    /* Profile */
    .profile-card {
      background: #fff;
      border-radius: 28px;
      padding: 25px 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
      margin-bottom: 20px;
    }

    .profile-top {
      text-align: center;
      margin-bottom: 22px;
    }

    .profile-image {
      width: 125px;
      height: 125px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      display: flex;
      justify-content: center;
      align-items: center;
      margin: auto;
      box-shadow: 0 8px 25px rgba(37,99,235,0.35);
    }

    .profile-image span {
      font-size: 65px;
    }

    .profile-name {
      font-size: 25px;
      font-weight: bold;
      margin-top: 15px;
    }

    .profile-email {
      color: #64748b;
      font-size: 14px;
      margin-top: 5px;
      word-break: break-word;
    }

    /* User Info */
    .info-box {
      background: #f8fafc;
      border-radius: 16px;
      padding: 14px;
      margin-top: 10px;
      border: 1px solid #e2e8f0;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: #64748b;
      font-size: 14px;
    }

    .info-value {
      font-weight: bold;
      text-align: right;
      word-break: break-word;
    }

    /* Income Title */
    .income-title {
      color: white;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin: 25px 0 15px;
    }

    /* Income Grid */
    .income-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .income-card {
      background: white;
      border-radius: 18px;
      padding: 18px 12px;
      text-align: center;
      box-shadow: 0 7px 20px rgba(0,0,0,0.13);
    }

    .income-icon {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .income-name {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 7px;
    }

    .income-amount {
      font-size: 21px;
      font-weight: bold;
      color: #16a34a;
    }

    /* Total */
    .total-card {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 23px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(79,70,229,0.30);
    }

    .total-card .income-name {
      color: rgba(255,255,255,0.85);
    }

    .total-card .income-amount {
      color: white;
      font-size: 30px;
    }

    /* Loading */
    .loading {
      text-align: center;
      color: white;
      padding: 40px 10px;
      font-size: 18px;
    }

    .spinner {
      width: 45px;
      height: 45px;
      border: 5px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Error */
    .error-box {
      background: #fee2e2;
      color: #991b1b;
      padding: 18px;
      border-radius: 16px;
      text-align: center;
      display: none;
      margin-bottom: 20px;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 78px;
      background: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.12);
      z-index: 999;
    }

    .nav-item {
      text-decoration: none;
      color: #64748b;
      text-align: center;
      font-size: 12px;
      min-width: 65px;
    }

    .nav-icon {
      display: block;
      font-size: 27px;
      margin-bottom: 3px;
    }

    .nav-item.active {
      color: #2563eb;
      font-weight: bold;
    }

    /* Mobile */
    @media (max-width: 380px) {

      .container {
        padding: 15px 10px;
      }

      .income-grid {
        gap: 9px;
      }

      .income-card {
        padding: 15px 8px;
      }

      .income-amount {
        font-size: 18px;
      }

      .profile-image {
        width: 110px;
        height: 110px;
      }
    }
  </style>
</head>

  <!-- Firebase -->
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    import {
      getFirestore,
      doc,
      getDoc,
      collection,
      query,
      where,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    /*
     * ==========================================
     * FIREBASE CONFIG
     * ==========================================
     *
     * এখানে আপনার আগের Firebase Config বসাবেন।
     */

    const firebaseConfig = {
  apiKey: "AIzaSyBFUKPT7fo6sUofdO09ffiZgjdlaR5evm8",
  authDomain: "rakib-freelancer-9c66b.firebaseapp.com",
  projectId: "rakib-freelancer-9c66b",
  storageBucket: "rakib-freelancer-9c66b.firebasestorage.app",
  messagingSenderId: "541209844482",
  appId: "1:541209844482:web:510568d5226c9bf47ac01b",
  measurementId: "G-F6QNE0QN5K"
};


    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const db =
      getFirestore(app);


    /*
     * ==========================================
     * ELEMENTS
     * ==========================================
     */

    const loadingBox =
      document.getElementById("loadingBox");

    const errorBox =
      document.getElementById("errorBox");

    const profileSection =
      document.getElementById("profileSection");


    /*
     * ==========================================
     * NUMBER FORMAT
     * ==========================================
     */

    function money(amount) {

      return "৳" +
        Number(amount || 0)
          .toLocaleString("en-US", {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
          });

    }


    /*
     * ==========================================
     * DATE CONVERT
     * ==========================================
     */

    function getDate(value) {

      if (!value) {
        return null;
      }


      if (
        typeof value.toDate === "function"
      ) {

        return value.toDate();

      }


      if (
        value.seconds !== undefined
      ) {

        return new Date(
          value.seconds * 1000
        );

      }


      if (
        value instanceof Date
      ) {

        return value;

      }


      const date =
        new Date(value);


      if (
        isNaN(date.getTime())
      ) {

        return null;

      }


      return date;

    }


    /*
     * ==========================================
     * LOAD PROFILE
     * ==========================================
     */

    async function loadProfile(user) {

      try {

        /*
         * users/{uid}
         */

        const userRef =
          doc(
            db,
            "users",
            user.uid
          );


        const userSnap =
          await getDoc(userRef);


        if (!userSnap.exists()) {

          throw new Error(
            "আপনার Profile Data পাওয়া যায়নি।"
          );

        }


        const userData =
          userSnap.data();


        /*
         * Profile Name
         */

        const name =
          userData.name ||
          userData.displayName ||
          "User";


        document.getElementById(
          "profileName"
        ).textContent = name;


        /*
         * Email
         */

        const email =
          userData.email ||
          user.email ||
          "-";


        document.getElementById(
          "profileEmail"
        ).textContent = email;


        document.getElementById(
          "emailValue"
        ).textContent = email;


        /*
         * Referral
         */

        document.getElementById(
          "referralValue"
        ).textContent =
          userData.referralCode || "-";


        /*
         * Balance
         */

        document.getElementById(
          "balanceValue"
        ).textContent =
          money(userData.balance);


        /*
         * Verification
         */

        const verified =
          userData.verified === true;


        document.getElementById(
          "verifiedValue"
        ).textContent =
          verified
            ? "✅ Verified"
            : "❌ Not Verified";


        /*
         * Load Income
         */

        try {
    await loadIncome(user.uid);
} catch (error) {
    console.error("Income Error:", error);
        }


        /*
         * Hide Loading
         */

        loadingBox.style.display =
          "none";


        profileSection.style.display =
          "block";

      }

      catch (error) {

        console.error(
          "Profile Error:",
          error
        );


        loadingBox.style.display =
          "none";


        errorBox.style.display =
          "block";


        errorBox.textContent =
          "❌ " +
          (
            error.message ||
            "Profile Load করতে সমস্যা হয়েছে।"
          );

      }

    }


    /*
 * ==========================================
 * LOAD INCOME FROM income COLLECTION
 * ==========================================
 */

async function loadIncome(uid) {

  try {

    // =====================================
    // GET CURRENT USER INCOME
    // =====================================

    const incomeRef = collection(
      db,
      "income"
    );

    const incomeQuery = query(
      incomeRef,
      where("uid", "==", uid)
    );

    const snapshot = await getDocs(
      incomeQuery
    );


    // =====================================
    // CURRENT DATE/TIME
    // =====================================

    const now = new Date();


    // =====================================
    // TODAY START
    // আজ রাত ১২টা
    // =====================================

    const todayStart = new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate(),
      0,
      0,
      0,
      0
    );


    // =====================================
    // TOMORROW START
    // =====================================

    const tomorrowStart = new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate() + 1,
      0,
      0,
      0,
      0
    );


    // =====================================
    // YESTERDAY START
    // =====================================

    const yesterdayStart = new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate() - 1,
      0,
      0,
      0,
      0
    );


    // =====================================
    // LAST 7 DAYS
    // =====================================

    const sevenDaysStart = new Date(
      now.getTime() -
      (7 * 24 * 60 * 60 * 1000)
    );


    // =====================================
    // LAST 30 DAYS
    // =====================================

    const thirtyDaysStart = new Date(
      now.getTime() -
      (30 * 24 * 60 * 60 * 1000)
    );


    // =====================================
    // LAST 1 YEAR
    // =====================================

    const oneYearStart = new Date(
      now.getFullYear() - 1,
      now.getMonth(),
      now.getDate(),
      now.getHours(),
      now.getMinutes(),
      now.getSeconds(),
      now.getMilliseconds()
    );


    // =====================================
    // INCOME VARIABLES
    // =====================================

    let todayIncome = 0;

    let yesterdayIncome = 0;

    let sevenDayIncome = 0;

    let thirtyDayIncome = 0;

    let yearIncome = 0;

    let totalIncome = 0;


    // =====================================
    // LOOP ALL INCOME DOCUMENTS
    // =====================================

    snapshot.forEach((incomeDoc) => {

      const data = incomeDoc.data();


      // ===================================
      // AMOUNT
      // ===================================

      const amount = Number(
        data.amount || 0
      );


      // ===================================
      // TOTAL INCOME
      // সব income যোগ হবে
      // ===================================

      totalIncome += amount;


      // ===================================
      // CREATED DATE
      // ===================================

      let incomeDate = null;


      if (data.createdAt) {

        // Firestore Timestamp
        if (
          typeof data.createdAt.toDate ===
          "function"
        ) {

          incomeDate =
            data.createdAt.toDate();

        }

        // Timestamp-like object
        else if (
          data.createdAt.seconds !==
          undefined
        ) {

          incomeDate =
            new Date(
              data.createdAt.seconds * 1000
            );

        }

        // Normal date/string
        else {

          incomeDate =
            new Date(
              data.createdAt
            );

        }

      }


      // ===================================
      // DATE না থাকলে শুধু TOTAL থাকবে
      // ===================================

      if (
        !incomeDate ||
        isNaN(incomeDate.getTime())
      ) {

        return;

      }


      // ===================================
      // TODAY
      // ===================================

      if (
        incomeDate >= todayStart &&
        incomeDate < tomorrowStart
      ) {

        todayIncome += amount;

      }


      // ===================================
      // YESTERDAY
      // ===================================

      if (
        incomeDate >= yesterdayStart &&
        incomeDate < todayStart
      ) {

        yesterdayIncome += amount;

      }


      // ===================================
      // LAST 7 DAYS
      // ===================================

      if (
        incomeDate >= sevenDaysStart &&
        incomeDate <= now
      ) {

        sevenDayIncome += amount;

      }


      // ===================================
      // LAST 30 DAYS
      // ===================================

      if (
        incomeDate >= thirtyDaysStart &&
        incomeDate <= now
      ) {

        thirtyDayIncome += amount;

      }


      // ===================================
      // LAST 1 YEAR
      // ===================================

      if (
        incomeDate >= oneYearStart &&
        incomeDate <= now
      ) {

        yearIncome += amount;

      }

    });


    // =====================================
    // DISPLAY TODAY
    // =====================================

    document.getElementById(
      "todayIncome"
    ).textContent =
      money(todayIncome);


    // =====================================
    // DISPLAY YESTERDAY
    // =====================================

    document.getElementById(
      "yesterdayIncome"
    ).textContent =
      money(yesterdayIncome);


    // =====================================
    // DISPLAY 7 DAYS
    // =====================================

    document.getElementById(
      "sevenDayIncome"
    ).textContent =
      money(sevenDayIncome);


    // =====================================
    // DISPLAY 30 DAYS
    // =====================================

    document.getElementById(
      "thirtyDayIncome"
    ).textContent =
      money(thirtyDayIncome);


    // =====================================
    // DISPLAY 1 YEAR
    // =====================================

    document.getElementById(
      "yearIncome"
    ).textContent =
      money(yearIncome);


    // =====================================
    // DISPLAY TOTAL
    // =====================================

    document.getElementById(
      "totalIncome"
    ).textContent =
      money(totalIncome);


    // =====================================
    // DEBUG
    // =====================================

    console.log(
      "Income Summary:",
      {
        today: todayIncome,
        yesterday: yesterdayIncome,
        sevenDays: sevenDayIncome,
        thirtyDays: thirtyDayIncome,
        oneYear: yearIncome,
        total: totalIncome
      }
    );

  }

  catch (error) {

    console.error(
      "Income Load Error:",
      error
    );

    throw error;

  }

        }
     * ==========================================
     * AUTH
     * ==========================================
     */

    onAuthStateChanged(auth, async (user) => {
    loadingBox.style.display = "none";

    if (!user) {
        errorBox.style.display = "block";
        errorBox.textContent = "🔒 Login করা নেই";
        return;
    }

    try {
        await loadProfile(user);
    } catch (error) {
        console.error("PROFILE ERROR:", error);

        errorBox.style.display = "block";
        errorBox.textContent =
            "❌ Error: " + (error.message || "Unknown error");
    }
});
