<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profile - Rakib Freelancer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      width: 92%;
      max-width: 600px;
      margin: 30px auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .income-card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .income-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .income-value {
      font-size: 25px;
      font-weight: bold;
    }

    #loadingBox {
      text-align: center;
      padding: 40px 10px;
      font-size: 18px;
    }

    #errorBox {
      display: none;
      background: #ffe5e5;
      color: #b00020;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 15px;
    }

    #profileSection {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>আমার ইনকাম</h1>

    <div id="loadingBox">
      Profile Loading...
    </div>

    <div id="errorBox"></div>

    <div id="profileSection">

      <div class="income-card">
        <div class="income-title">আজকের ইনকাম</div>
        <div class="income-value" id="todayIncome">৳0</div>
      </div>

      <div class="income-card">
        <div class="income-title">গতকালের ইনকাম</div>
        <div class="income-value" id="yesterdayIncome">৳0</div>
      </div>

      <div class="income-card">
        <div class="income-title">গত ৭ দিনের ইনকাম</div>
        <div class="income-value" id="sevenDayIncome">৳0</div>
      </div>

      <div class="income-card">
        <div class="income-title">গত ৩০ দিনের ইনকাম</div>
        <div class="income-value" id="thirtyDayIncome">৳0</div>
      </div>

      <div class="income-card">
        <div class="income-title">মোট ইনকাম</div>
        <div class="income-value" id="totalIncome">৳0</div>
      </div>

    </div>
  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    import {
      getFirestore,
      collection,
      query,
      where,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    // ==============================
    // FIREBASE CONFIG
    // ==============================

    const firebaseConfig = {
      apiKey: "AIzaSyBFUKPT7fo6sUofd009ffiZgjdlaR5evm8",
      authDomain: "rakib-freelancer-9c66b.firebaseapp.com",
      projectId: "rakib-freelancer-9c66b",
      storageBucket: "rakib-freelancer-9c66b.firebasestorage.app",
      messagingSenderId: "54120984482",
      appId: "1:54120984482:web:5105d65226c9bf47ac01b",
      measurementId: "G-F6QNEQN5K"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);


    // ==============================
    // ELEMENTS
    // ==============================

    const loadingBox =
      document.getElementById("loadingBox");

    const errorBox =
      document.getElementById("errorBox");

    const profileSection =
      document.getElementById("profileSection");


    // ==============================
    // NUMBER FORMAT
    // ==============================

    function money(amount) {

      return "৳" + Number(amount || 0).toLocaleString("en-BD", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      });

    }


    // ==============================
    // LOAD INCOME
    // ==============================

    async function loadIncome(uid) {

      let todayIncome = 0;
      let yesterdayIncome = 0;
      let sevenDayIncome = 0;
      let thirtyDayIncome = 0;
      let totalIncome = 0;


      const incomeRef = collection(db, "income");

      const incomeQuery = query(
        incomeRef,
        where("uid", "==", uid)
      );

      const snapshot = await getDocs(incomeQuery);


      // আজকের তারিখ
      const now = new Date();

      const todayStart = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
      );

      const tomorrowStart = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate() + 1
      );


      // গতকাল
      const yesterdayStart = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate() - 1
      );


      // ৭ দিন
      const sevenDayStart = new Date(
        now.getTime() - (7 * 24 * 60 * 60 * 1000)
      );


      // ৩০ দিন
      const thirtyDayStart = new Date(
        now.getTime() - (30 * 24 * 60 * 60 * 1000)
      );


      snapshot.forEach((docSnap) => {

        const data = docSnap.data();

        const amount = Number(data.amount || 0);

        totalIncome += amount;


        let incomeDate = null;


        // Firebase Timestamp
        if (
          data.createdAt &&
          typeof data.createdAt.toDate === "function"
        ) {

          incomeDate = data.createdAt.toDate();

        }


        // যদি createdAt string/date হয়
        else if (data.createdAt) {

          incomeDate = new Date(data.createdAt);

        }


        if (
          !incomeDate ||
          isNaN(incomeDate.getTime())
        ) {
          return;
        }


        // আজ
        if (
          incomeDate >= todayStart &&
          incomeDate < tomorrowStart
        ) {

          todayIncome += amount;

        }


        // গতকাল
        if (
          incomeDate >= yesterdayStart &&
          incomeDate < todayStart
        ) {

          yesterdayIncome += amount;

        }


        // গত ৭ দিন
        if (
          incomeDate >= sevenDayStart &&
          incomeDate <= now
        ) {

          sevenDayIncome += amount;

        }


        // গত ৩০ দিন
        if (
          incomeDate >= thirtyDayStart &&
          incomeDate <= now
        ) {

          thirtyDayIncome += amount;

        }

      });


      // ==============================
      // SHOW DATA
      // ==============================

      document.getElementById("todayIncome").textContent =
        money(todayIncome);

      document.getElementById("yesterdayIncome").textContent =
        money(yesterdayIncome);

      document.getElementById("sevenDayIncome").textContent =
        money(sevenDayIncome);

      document.getElementById("thirtyDayIncome").textContent =
        money(thirtyDayIncome);

      document.getElementById("totalIncome").textContent =
        money(totalIncome);

    }


    // ==============================
    // AUTH
    // ==============================

    onAuthStateChanged(auth, async (user) => {

      try {

        if (!user) {

          loadingBox.style.display = "none";

          errorBox.style.display = "block";

          errorBox.textContent =
            "❌ আপনি Login করা নেই।";

          return;

        }


        await loadIncome(user.uid);


        loadingBox.style.display = "none";

        profileSection.style.display = "block";


      } catch (error) {

        console.error(
          "Profile Error:",
          error
        );


        loadingBox.style.display = "none";

        profileSection.style.display = "none";

        errorBox.style.display = "block";

        errorBox.textContent =
          "❌ Income Load Error: " +
          (error.message || "Unknown error");

      }

    });

  </script>

</body>
</html>
