<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Verification</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #222;
    }

    .header {
      background: #f5b800;
      color: white;
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
    }

    .box {
      width: 90%;
      max-width: 420px;
      margin: 30px auto;
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-sizing: border-box;
    }

    h2 {
      margin-top: 0;
      text-align: center;
    }

    .price {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #f5b800;
      margin: 20px 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    .submit-btn {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .back-btn {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #ddd;
      color: #222;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="header">
    Account Verification
  </div>

  <div class="box">

    <h2>Account Verification</h2>

    <div class="price">
      Verification Fee: ৳60
    </div>
    <div
  id="verificationStatus"
  style="
    display:none;
    text-align:center;
    padding:18px;
    margin:20px 0;
    background:#dcfce7;
    color:#166534;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
  ">
    </div>
    <div id="verificationForm">
<label>Payment Method</label>

<select id="paymentMethod" onchange="showPaymentNumber()">
    <option value="">-- নির্বাচন করুন --</option>
    <option value="bkash">bKash</option>
    <option value="nagad">Nagad</option>
</select>

<div id="paymentInfo" style="display:none; margin:10px 0; padding:12px; background:#f1f1f1; border-radius:8px;">
    <b id="paymentTitle"></b>
    <br>
    <span id="paymentDisplayNumber"></span>
</div>
    <label>আপনার নাম</label>
    <input
      type="text"
      id="userName"
      placeholder="আপনার নাম লিখুন"
    >

    <label>যে নম্বর থেকে টাকা দিয়েছেন</label>
    <input
      type="tel"
      id="paymentNumber"
      placeholder="01XXXXXXXXX"
    >

    <label>Transaction ID</label>
    <input
      type="text"
      id="transactionId"
      placeholder="Transaction ID লিখুন"
    >

    <button class="submit-btn" onclick="submitVerification()">
      Verification Submit
    </button>

    <button class="back-btn" onclick="history.back()">
      Back
    </button>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  doc,
  getDoc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    const firebaseConfig = {
  apiKey: "AIzaSyBFUKPT7fo6sUofdO09ffiZgjdlaR5evm8",
  authDomain: "rakib-freelancer-9c66b.firebaseapp.com",
  projectId: "rakib-freelancer-9c66b",
  storageBucket: "rakib-freelancer-9c66b.firebasestorage.app",
  messagingSenderId: "541209844482",
  appId: "1:541209844482:web:510568d5226c9bf47ac01b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
    const db = getFirestore(app);
    // =====================================
// CHECK ACCOUNT VERIFICATION
// =====================================

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    alert("⚠️ আগে Login করুন");
    window.location.href = "index.html";
    return;
  }

  try {

    const userRef = doc(
      db,
      "users",
      user.uid
    );

    const userSnap = await getDoc(userRef);

    if (userSnap.exists()) {

      const userData = userSnap.data();

      if (userData.verified === true) {

        document.getElementById(
          "verificationForm"
        ).style.display = "none";

        const status =
          document.getElementById(
            "verificationStatus"
          );

        status.style.display = "block";

        status.innerHTML =
          "✅ আপনার একাউন্ট ভেরিফাই করা আছে";

      }

    }

  } catch (error) {

    console.error(
      "Verification Status Error:",
      error
    );

  }

});
    window.showPaymentNumber = function () {
    const method = document.getElementById("paymentMethod").value;

    const info = document.getElementById("paymentInfo");
    const title = document.getElementById("paymentTitle");
    const number = document.getElementById("paymentDisplayNumber");

    if (method === "bkash") {
        info.style.display = "block";
        title.textContent = "bKash";
        number.textContent = "01837976455";
    } 
    else if (method === "nagad") {
        info.style.display = "block";
        title.textContent = "Nagad";
        number.textContent = "01404534868";
    } 
    else {
        info.style.display = "none";
    }
    }
    window.submitVerification = async function () {

  const name = document.getElementById("userName").value.trim();
  const number = document.getElementById("paymentNumber").value.trim();
  const transactionId =
    document.getElementById("transactionId").value.trim();

  if (!name || !number || !transactionId) {
    alert("⚠️ সব তথ্য পূরণ করুন");
    return;
  }

  try {

    const user = auth.currentUser;

    if (!user) {
      alert("⚠️ আগে Login করুন");
      window.location.href = "index.html";
      return;
    }

    await addDoc(collection(db, "verificationRequests"), {

      userId: user.uid,
      email: user.email,
      name: name,

      verificationPaymentNumber: number,
      verificationTransactionId: transactionId,

      verificationStatus: "pending",
      verified: false,

      submittedAt: serverTimestamp()

    });

    alert(
      "✅ Verification request সফলভাবে পাঠানো হয়েছে। Admin Approve করলে Account Verified হবে।"
    );

    window.location.href = "dashboard.html";

  } catch (error) {

    console.error("Verification Error:", error);

    alert(
      "❌ Verification Submit করা যায়নি: " +
      error.message
    );

  }

};
  </script>

</body>
</html>
