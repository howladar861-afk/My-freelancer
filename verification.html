<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Verification</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #222;
    }

    .header {
      background: #f5b800;
      color: white;
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
    }

    .box {
      width: 90%;
      max-width: 420px;
      margin: 30px auto;
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-sizing: border-box;
    }

    h2 {
      margin-top: 0;
      text-align: center;
    }

    .price {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #f5b800;
      margin: 20px 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    .submit-btn {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .back-btn {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #ddd;
      color: #222;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="header">
    Account Verification
  </div>

  <div class="box">

    <h2>Account Verification</h2>

    <div class="price">
      Verification Fee: ৳60
    </div>

    <label>আপনার নাম</label>
    <input
      type="text"
      id="userName"
      placeholder="আপনার নাম লিখুন"
    >

    <label>যে নম্বর থেকে টাকা দিয়েছেন</label>
    <input
      type="tel"
      id="paymentNumber"
      placeholder="01XXXXXXXXX"
    >

    <label>Transaction ID</label>
    <input
      type="text"
      id="transactionId"
      placeholder="Transaction ID লিখুন"
    >

    <button class="submit-btn" onclick="submitVerification()">
      Verification Submit
    </button>

    <button class="back-btn" onclick="history.back()">
      Back
    </button>

  </div>

  <script>
    function submitVerification() {

      const name = document.getElementById("userName").value.trim();
      const number = document.getElementById("paymentNumber").value.trim();
      const transactionId =
        document.getElementById("transactionId").value.trim();

      if (!name || !number || !transactionId) {
        alert("সব তথ্য পূরণ করুন।");
        return;
      }

      alert("Verification request submitted.");

      // Firebase database connection
      // পরের ধাপে এখানে Firebase-এ তথ্য পাঠাব।

    }
  </script>

</body>
</html>
